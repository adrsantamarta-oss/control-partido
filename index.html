
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0B3D2E">
<title>Control de Partido — C.D. Raíces</title>
<link rel="icon" href="data:,">
<style>
  :root{
    --pitch:#0B3D2E; --pitch-dark:#08281D; --pitch-line:#1B5E3F;
    --chalk:#F5F3EC; --ink:#12201A;
    --amber:#F2B705; --red:#C6362F; --rival:#5B6B6B;
    --border:#D8D2C0; --field:#EFEBDF; --green-ok:#1E8E3E;
    --radius:14px; --radius-sm:10px;
    --shadow:0 2px 12px rgba(0,0,0,.08);
    --transition:all .2s cubic-bezier(.4,0,.2,1);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:var(--chalk); color:var(--ink); overscroll-behavior:none;
  }
  #app{max-width:480px; margin:0 auto; min-height:100vh; background:var(--chalk); position:relative; padding-bottom:76px;}

  /* ---------- HEADER ---------- */
  .header{
    background:linear-gradient(180deg, var(--pitch) 0%, var(--pitch-dark) 100%);
    padding:14px 16px 12px; position:sticky; top:0; z-index:20;
    box-shadow:0 4px 16px rgba(0,0,0,.25);
  }
  .score-row{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .team-name{
    flex:1; min-width:0; font-size:15px; font-weight:800; text-transform:uppercase;
    letter-spacing:.04em; color:var(--chalk); white-space:nowrap; overflow:hidden;
    text-overflow:ellipsis; display:block;
  }
  .team-name.right{text-align:right;}
  .score-box{
    display:flex; align-items:baseline; gap:6px; background:rgba(0,0,0,.35);
    border:1px solid var(--pitch-line); border-radius:var(--radius-sm);
    padding:4px 14px; flex-shrink:0; backdrop-filter:blur(4px);
  }
  .score-num{font-family:'Courier New',monospace; font-size:28px; font-weight:800; line-height:1;}
  .score-num.amber{color:var(--amber);}
  .score-num.chalk{color:var(--chalk);}
  .score-dash{color:var(--chalk); opacity:.35; font-size:18px; font-weight:700;}
  .edit-btn{
    display:flex; align-items:center; gap:4px; background:none; border:none;
    color:var(--chalk); font-size:15px; font-weight:800; text-transform:uppercase;
    letter-spacing:.04em; cursor:pointer; padding:0; max-width:100%;
  }
  .edit-btn .name{
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    max-width:6.5rem; display:inline-block;
  }
  .edit-btn .pencil{font-size:12px; opacity:.6;}

  .side-toggle{display:flex; gap:8px; margin-top:12px;}
  .side-btn{
    flex:1; padding:7px 4px; font-size:10px; font-weight:800; text-transform:uppercase;
    letter-spacing:.03em; border-radius:8px; border:1px solid var(--pitch-line);
    background:transparent; color:var(--chalk); opacity:.6; cursor:pointer;
    transition:var(--transition);
  }
  .side-btn.active{
    background:var(--amber); color:var(--pitch); opacity:1;
    border-color:var(--amber); box-shadow:0 2px 8px rgba(242,183,5,.35);
  }
  .action-row{display:flex; gap:8px; margin-top:8px;}
  .btn-finish{
    flex:1; background:var(--amber); color:var(--pitch); border:none;
    border-radius:10px; padding:10px; font-size:13px; font-weight:800;
    text-transform:uppercase; letter-spacing:.03em; cursor:pointer;
    box-shadow:0 3px 10px rgba(242,183,5,.3); transition:var(--transition);
  }
  .btn-finish:active{transform:scale(.97);}
  .btn-archive-icon{
    background:rgba(255,255,255,.08); border:1px solid var(--pitch-line);
    color:var(--chalk); border-radius:10px; padding:10px 14px;
    font-size:13px; font-weight:800; cursor:pointer; transition:var(--transition);
    display:flex; align-items:center; gap:5px;
  }
  .btn-archive-icon:active{transform:scale(.97);}
  .archive-count{
    background:var(--amber); color:var(--pitch); border-radius:20px;
    padding:1px 6px; font-size:10px; font-weight:800;
  }

  /* ---------- CONTENT ---------- */
  .tab-content{padding:14px 16px 100px; animation:fadeIn .25s ease;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  .card{
    background:#fff; border:1px solid var(--border); border-radius:var(--radius);
    padding:14px; margin-bottom:16px; box-shadow:var(--shadow);
  }
  .card.soft{background:var(--field); box-shadow:none;}

  .field-row{display:flex; gap:8px; margin-bottom:10px;}
  .field{flex:1; min-width:0; display:flex; flex-direction:column; gap:4px;}
  .field label{
    font-size:9px; font-weight:800; text-transform:uppercase;
    letter-spacing:.04em; color:var(--ink); opacity:.5;
  }
  .field input{
    width:100%; border:1.5px solid var(--border); background:var(--field);
    border-radius:10px; padding:10px 6px; font-size:17px; font-weight:800;
    text-align:center; outline:none; transition:var(--transition);
    font-family:inherit; color:var(--ink);
  }
  .field input:focus{
    border-color:var(--pitch); background:#fff;
    box-shadow:0 0 0 3px rgba(11,61,46,.12);
  }
  .field input:disabled{opacity:.5; background:var(--border);}
  .field-error{font-size:9px; font-weight:700; color:var(--red); min-height:12px; margin-top:2px;}
  .hint{font-size:10px; font-weight:600; opacity:.5; margin:0 0 10px; line-height:1.4;}

  .btn-primary{
    width:100%; background:var(--pitch); color:var(--chalk); border:none;
    border-radius:11px; padding:12px; font-size:13px; font-weight:800;
    text-transform:uppercase; letter-spacing:.04em; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:6px;
    transition:var(--transition); box-shadow:0 3px 10px rgba(11,61,46,.25);
  }
  .btn-primary:active:not(:disabled){transform:scale(.98);}
  .btn-primary:disabled{opacity:.35; cursor:not-allowed; box-shadow:none;}

  /* ---------- VENTANA / TYPE BUTTONS ---------- */
  .ventana-row{display:flex; gap:6px; margin-bottom:12px;}
  .ventana-btn{
    flex:1; padding:9px 4px; font-size:11px; font-weight:800;
    text-transform:uppercase; border-radius:9px; border:2px solid transparent;
    cursor:pointer; transition:var(--transition);
  }
  .ventana-btn:active{transform:scale(.96);}
  .type-row{display:flex; gap:8px; margin-bottom:14px;}
  .type-btn{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:6px;
    padding:10px 6px; background:var(--field); border-radius:11px;
    border:2px solid transparent; cursor:pointer; transition:var(--transition);
  }
  .type-btn:active{transform:scale(.96);}
  .type-btn span.label{font-size:9px; font-weight:800; text-transform:uppercase; opacity:.7;}
  .card-chip{
    display:inline-block; width:13px; height:18px; border-radius:2.5px;
    vertical-align:middle; box-shadow:0 1px 2px rgba(0,0,0,.2);
  }
  .card-chip.double{position:relative; width:20px;}
  .card-chip.double .a{position:absolute; left:0; transform:rotate(-8deg);}
  .card-chip.double .b{position:absolute; left:8px; transform:rotate(8deg);}

  /* ---------- LISTS ---------- */
  .empty{text-align:center; padding:32px 16px; opacity:.35; font-size:13px; font-weight:600;}
  .group-header{display:flex; align-items:center; gap:8px; margin-bottom:6px; padding-left:2px;}
  .dot{width:10px; height:10px; border-radius:50%; flex-shrink:0; display:inline-block;}
  .group-label{font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.04em;}
  .group-divider{border-top:2px solid var(--border); margin-top:8px; padding-top:14px;}

  .event-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:9px 10px; background:#fff; border:1px solid var(--border);
    border-radius:10px; margin-bottom:6px; transition:var(--transition);
  }
  .event-row:active{background:var(--field);}
  .event-left{display:flex; align-items:center; gap:10px; min-width:0;}
  .minute-badge{
    font-family:'Courier New',monospace; font-size:12px; font-weight:800;
    background:var(--pitch); color:var(--amber); padding:3px 8px;
    border-radius:6px; flex-shrink:0;
  }
  .event-text{font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .del-btn{
    background:none; border:none; color:var(--ink); opacity:.3;
    cursor:pointer; padding:6px; font-size:16px; transition:var(--transition);
    border-radius:8px; flex-shrink:0;
  }
  .del-btn:active{opacity:.9; background:rgba(198,54,47,.1);}

  /* ---------- BOTTOM NAV ---------- */
  .bottom-nav{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:480px; display:flex; background:var(--pitch-dark);
    border-top:1px solid var(--pitch-line); z-index:20;
    padding-bottom:env(safe-area-inset-bottom, 0);
  }
  .nav-btn{
    flex:1; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:4px; padding:10px 0 12px; background:none;
    border:none; cursor:pointer; position:relative; transition:var(--transition);
  }
  .nav-btn:active{background:rgba(255,255,255,.05);}
  .nav-icon{font-size:18px; line-height:1; opacity:.4; transition:var(--transition);}
  .nav-btn.active .nav-icon{opacity:1; transform:translateY(-1px);}
  .nav-label{
    font-size:10px; font-weight:800; text-transform:uppercase;
    letter-spacing:.03em; color:#5A6E64; transition:var(--transition);
  }
  .nav-btn.active .nav-label{color:var(--chalk);}
  .nav-badge{
    position:absolute; top:4px; right:22%; min-width:16px; height:16px;
    border-radius:50%; background:var(--amber); color:var(--pitch);
    font-size:9px; font-weight:800; display:flex; align-items:center;
    justify-content:center; padding:0 4px; box-shadow:0 2px 6px rgba(242,183,5,.4);
  }

  /* ---------- RESUMEN ---------- */
  .resumen-header{
    background:linear-gradient(180deg, var(--pitch) 0%, var(--pitch-dark) 100%);
    padding:14px 16px; display:flex; align-items:center; gap:12px;
    position:sticky; top:0; z-index:20; box-shadow:0 4px 16px rgba(0,0,0,.2);
  }
  .back-btn{
    background:rgba(255,255,255,.08); border:none; color:var(--chalk);
    font-size:18px; cursor:pointer; padding:6px 12px; line-height:1;
    border-radius:9px; transition:var(--transition);
  }
  .back-btn:active{background:rgba(255,255,255,.2);}
  .resumen-title{
    font-size:15px; font-weight:800; text-transform:uppercase;
    letter-spacing:.04em; color:var(--chalk);
  }
  .resumen-body{padding:16px; max-width:480px; margin:0 auto; animation:fadeIn .3s ease;}
  .score-card{
    background:linear-gradient(135deg, var(--pitch) 0%, var(--pitch-dark) 100%);
    border-radius:var(--radius); padding:18px 14px; margin-bottom:20px;
    text-align:center; box-shadow:0 6px 20px rgba(11,61,46,.3);
  }
  .score-card .label{
    font-size:11px; font-weight:800; text-transform:uppercase;
    color:var(--chalk); opacity:.6; margin-bottom:8px; letter-spacing:.05em;
  }
  .score-card .row{display:flex; align-items:center; justify-content:center; gap:14px;}
  .score-card .side{
    font-size:13px; font-weight:800; text-transform:uppercase;
    color:var(--chalk); max-width:5.5rem; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap;
  }
  .score-card .sublabel{
    font-size:10px; font-weight:600; color:var(--chalk);
    opacity:.45; margin-top:8px;
  }
  .section{margin-bottom:20px;}
  .section h3{
    font-size:12px; font-weight:800; text-transform:uppercase;
    letter-spacing:.04em; opacity:.55; margin:0 0 10px;
  }
  .section .empty-line{font-size:13px; opacity:.35; margin:0; font-weight:600;}
  .group-box{border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow);}
  .group-box .g-head{padding:8px 14px;}
  .group-box .g-head span{font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.03em;}
  .group-box .g-body{padding:8px 14px; background:#fff;}
  .group-box .g-body div{font-size:14px; font-weight:600; padding:3px 0;}
  .list-box{border:1px solid var(--border); border-radius:var(--radius); padding:8px 14px; background:#fff; box-shadow:var(--shadow);}
  .list-box div{font-size:14px; font-weight:600; padding:3px 0;}
  .archive-btn{
    width:100%; margin-top:10px; background:var(--amber); color:var(--pitch);
    border:none; border-radius:11px; padding:14px; font-size:13px;
    font-weight:800; text-transform:uppercase; letter-spacing:.04em;
    cursor:pointer; box-shadow:0 4px 14px rgba(242,183,5,.35);
    transition:var(--transition);
  }
  .archive-btn:active{transform:scale(.98);}
  .archive-label{font-size:11px; font-weight:600; opacity:.5; margin:0 0 14px;}

  /* ---------- ARCHIVO ---------- */
  .archivo-item{
    width:100%; display:flex; align-items:center; justify-content:space-between;
    background:#fff; border:1px solid var(--border); border-radius:var(--radius);
    padding:14px; margin-bottom:10px; cursor:pointer; text-align:left;
    box-shadow:var(--shadow); transition:var(--transition);
  }
  .archivo-item:active{transform:scale(.98); background:var(--field);}
  .archivo-item .main{font-size:14px; font-weight:800;}
  .archivo-item .sub{font-size:11px; opacity:.5; margin-top:3px;}
  .archivo-item .arrow{opacity:.3; font-size:18px;}

  /* ---------- PLAYER ROWS ---------- */
  .player-row{
    display:flex; align-items:center; gap:8px; padding:9px 4px;
    border-bottom:1px solid var(--border); transition:var(--transition);
  }
  .player-row:last-child{border-bottom:none;}
  .player-num{
    font-family:'Courier New',monospace; font-weight:800; font-size:12px;
    background:var(--pitch); color:var(--amber); padding:3px 7px;
    border-radius:6px; min-width:30px; text-align:center; flex-shrink:0;
  }
  .player-name{flex:1; font-size:14px; font-weight:600; min-width:0;}
  .player-name.strike{text-decoration:line-through; opacity:.55;}
  .sub-in{font-size:12px; font-weight:800; color:var(--green-ok); flex-shrink:0;}
  button.player-num{
    all:unset; font-family:'Courier New',monospace; font-weight:800;
    font-size:12px; background:var(--pitch); color:var(--amber);
    padding:3px 7px; border-radius:6px; min-width:30px; text-align:center;
    flex-shrink:0; cursor:pointer; border-bottom:2px dashed var(--amber);
  }
  button.player-name{
    all:unset; flex:1; font-size:14px; font-weight:600; min-width:0;
    cursor:pointer; text-align:left; border-bottom:1.5px dashed var(--border);
    padding-bottom:1px;
  }
  button.player-name.strike{text-decoration:line-through; opacity:.55;}
  .inline-edit-num{
    width:3.2rem; font-family:'Courier New',monospace; font-weight:800;
    font-size:14px; text-align:center; padding:5px 4px; border:2px solid var(--pitch);
    border-radius:8px; background:#fff; color:var(--ink); flex-shrink:0;
  }
  .inline-edit-name{
    flex:1; min-width:0; font-size:14px; font-weight:600; padding:5px 8px;
    border:2px solid var(--pitch); border-radius:8px; background:#fff; color:var(--ink);
  }
  .drag-handle{
    background:none; border:none; color:var(--ink); opacity:.3;
    font-size:18px; padding:2px 6px; cursor:pointer; flex-shrink:0;
    line-height:1; touch-action:none; border-radius:6px;
  }
  .drag-handle:active{opacity:.8; background:var(--field);}
  .player-row.dragging{
    background:#fff; box-shadow:0 8px 20px rgba(0,0,0,.2);
    border-radius:10px; opacity:.95; z-index:10; position:relative;
  }
  .drop-indicator{
    height:3px; background:var(--amber); border-radius:2px; margin:3px 0;
    box-shadow:0 0 8px rgba(242,183,5,.6); animation:pulse .8s infinite;
  }
  @keyframes pulse{0%,100%{opacity:1;} 50%{opacity:.5;}}

  /* ---------- TOAST ---------- */
  .toast{
    position:fixed; bottom:90px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--pitch-dark); color:var(--chalk); padding:10px 20px;
    border-radius:10px; font-size:13px; font-weight:700; opacity:0;
    pointer-events:none; transition:all .3s ease; z-index:100;
    box-shadow:0 4px 16px rgba(0,0,0,.3); max-width:90%; text-align:center;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  /* ---------- MODAL ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:50;
    display:flex; align-items:center; justify-content:center; padding:20px;
    animation:fadeIn .2s ease; backdrop-filter:blur(2px);
  }
  .modal{
    background:var(--chalk); border-radius:var(--radius); padding:20px;
    width:100%; max-width:340px; box-shadow:0 10px 40px rgba(0,0,0,.3);
    animation:slideUp .25s ease;
  }
  @keyframes slideUp{from{transform:translateY(20px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  .modal h3{margin:0 0 14px; font-size:15px; font-weight:800; text-transform:uppercase; letter-spacing:.03em;}
  .modal input{
    width:100%; border:1.5px solid var(--border); background:#fff;
    border-radius:10px; padding:12px; font-size:16px; font-weight:700;
    outline:none; margin-bottom:14px; font-family:inherit;
  }
  .modal input:focus{border-color:var(--pitch); box-shadow:0 0 0 3px rgba(11,61,46,.12);}
  .modal-actions{display:flex; gap:8px;}
  .modal-actions button{
    flex:1; padding:11px; border-radius:10px; font-size:13px; font-weight:800;
    text-transform:uppercase; letter-spacing:.03em; cursor:pointer;
    border:none; transition:var(--transition);
  }
  .modal-actions .cancel{background:var(--field); color:var(--ink);}
  .modal-actions .confirm{background:var(--pitch); color:var(--chalk);}
  .modal-actions button:active{transform:scale(.97);}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
(function(){
  const HOME_NAME = "C.D. Raíces";
  const STORAGE_KEY = "partido-actual";
  const ARCHIVE_KEY = "partidos-archivados";
  const PLANTILLA_KEY = "plantilla-jugadores";
  const VENTANAS = [
    { key: "descanso", short: "Descanso", label: "Descanso", color: "#E85D9E", soft: "#FBE1EE" },
    { key: "1", short: "V1", label: "Ventana 1", color: "#C6362F", soft: "#F6D9D7" },
    { key: "2", short: "V2", label: "Ventana 2", color: "#D19A00", soft: "#FCEFC2" },
    { key: "3", short: "V3", label: "Ventana 3", color: "#2563A6", soft: "#D9E6F2" },
  ];

  function uid(){ return Math.random().toString(36).slice(2,10); }
  function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function formatDateLabel(iso){
    try{ return new Date(iso).toLocaleDateString('es-ES', {day:'2-digit', month:'short', year:'numeric'}); }
    catch(e){ return ''; }
  }
  function cardChip(tipo){
    if(tipo==='amarilla') return `<span class="card-chip" style="background:var(--amber)"></span>`;
    if(tipo==='roja') return `<span class="card-chip" style="background:var(--red)"></span>`;
    return `<span class="card-chip double"><span class="card-chip a" style="background:var(--amber)"></span><span class="card-chip b" style="background:var(--red)"></span></span>`;
  }
  function tipoLabel(t){ return t==='amarilla'?'Amarilla': t==='roja'?'Roja':'2ª amarilla'; }

  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(()=>t.classList.remove('show'), 1800);
  }

  let state = {
    view: 'match', tab: 'alineacion',
    awayName: 'Rival', esLocal: true, observaciones: '',
    roster: [], subs: [], cards: [], goals: [], rivalGoals: [],
    archivedMatches: [], openArchiveId: null, plantilla: [],
  };
  let alineacionForm = { numero: '', nombre: '' };
  let editingPlayer = null;
  let cambiosForm = { ventana: 'descanso', minuto: '', rows: [{entra:'',sale:''},{entra:'',sale:''},{entra:'',sale:''}] };
  let tarjetasForm = { dorsal: '', tipo: 'amarilla', minuto: '' };
  let golesForm = { dorsal: '' };

  function loadState(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        const d = JSON.parse(raw);
        state.awayName = d.awayName ?? 'Rival';
        state.esLocal = d.esLocal ?? true;
        state.observaciones = d.observaciones ?? '';
        state.roster = d.roster ?? [];
        state.subs = d.subs ?? [];
        state.cards = d.cards ?? [];
        state.goals = d.goals ?? [];
        state.rivalGoals = d.rivalGoals ?? [];
      }
    }catch(e){}
    try{
      const raw2 = localStorage.getItem(ARCHIVE_KEY);
      if(raw2) state.archivedMatches = JSON.parse(raw2);
    }catch(e){}
    try{
      const raw3 = localStorage.getItem(PLANTILLA_KEY);
      if(raw3) state.plantilla = JSON.parse(raw3);
    }catch(e){}
    seedRosterFromPlantilla();
  }
  function saveMatch(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        awayName: state.awayName, esLocal: state.esLocal, observaciones: state.observaciones,
        roster: state.roster, subs: state.subs, cards: state.cards, goals: state.goals, rivalGoals: state.rivalGoals
      }));
    }catch(e){}
  }
  function saveArchive(){
    try{ localStorage.setItem(ARCHIVE_KEY, JSON.stringify(state.archivedMatches)); }catch(e){}
  }
  function savePlantilla(){

        observaciones: m.observaciones ?? '',
        archivedLabel: `Guardado el ${m.dateLabel}`, showArchiveBtn:false

      attachResumenEvents(false);

    if(state.view === 'resumen'){

        observaciones: state.observaciones,
        archivedLabel:null, showArchiveBtn:true

      attachResumenEvents(true);

  function attachHeaderEvents(){
    document.querySelectorAll('.side-btn').forEach(btn=>{

      });
    }
    document.getElementById('btn-finish').addEventListener('click', ()=>{ state.view='resumen'; render(); });
    document.getElementById('btn-open-archive').addEventListener('click', ()=>{ state.view='archivo'; render(); });
  }

    if(state.tab==='goles') return renderGolesTab();
