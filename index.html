<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Control de Partido — C.D. Raíces</title>
<link rel="icon" href="data:,">
<style>
  :root{
    --pitch:#0B3D2E; --pitch-line:#1B5E3F; --chalk:#F5F3EC; --ink:#12201A;
    --amber:#F2B705; --red:#C6362F; --rival:#5B6B6B; --border:#D8D2C0; --field:#EFEBDF;
    --green-ok:#1E8E3E;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:var(--chalk); color:var(--ink);}
  #app{max-width:480px; margin:0 auto; min-height:100vh; background:var(--chalk); position:relative; padding-bottom:70px;}
  .header{background:var(--pitch); padding:12px 16px 10px; position:sticky; top:0; z-index:20; box-shadow:0 2px 8px rgba(0,0,0,.2);}
  .score-row{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .team-name{flex:1; min-width:0; font-size:14px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--chalk); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block;}
  .team-name.right{text-align:right;}
  .score-box{display:flex; align-items:baseline; gap:4px; background:#08281D; border:1px solid var(--pitch-line); border-radius:6px; padding:2px 12px; flex-shrink:0;}
  .score-num{font-family:'Courier New',monospace; font-size:24px; font-weight:800;}
  .score-num.amber{color:var(--amber);}
  .score-num.chalk{color:var(--chalk);}
  .score-dash{color:var(--chalk); opacity:.4; font-size:16px; font-weight:700;}
  .edit-btn{display:flex; align-items:center; gap:4px; background:none; border:none; color:var(--chalk); font-size:14px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; cursor:pointer; padding:0; max-width:100%;}
  .edit-btn span.name{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:6.5rem; display:inline-block;}
  .side-toggle{display:flex; gap:6px; margin-top:10px;}
  .side-btn{flex:1; padding:5px; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.02em; border-radius:6px; border:1px solid var(--pitch-line); background:transparent; color:var(--chalk); opacity:.7; cursor:pointer;}
  .side-btn.active{background:var(--amber); color:var(--pitch); opacity:1; border-color:var(--amber);}
  .action-row{display:flex; gap:6px; margin-top:6px;}
  .btn-finish{flex:1; background:var(--amber); color:var(--pitch); border:none; border-radius:8px; padding:7px; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.02em; cursor:pointer;}
  .btn-archive-icon{background:transparent; border:1px solid var(--pitch-line); color:var(--chalk); border-radius:8px; padding:7px 12px; font-size:12px; font-weight:700; cursor:pointer;}

  .tab-content{padding:12px 16px 90px;}
  .card{background:var(--chalk); border:1px solid var(--border); border-radius:12px; padding:12px; margin-bottom:14px;}
  .card.soft{background:#EDEAE2;}
  .field-row{display:flex; gap:6px; margin-bottom:8px;}
  .field{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px;}
  .field label{font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.02em; color:var(--ink); opacity:.55;}
  .field input{width:100%; border:1px solid var(--border); background:var(--field); border-radius:6px; padding:6px 4px; font-size:16px; font-weight:700; text-align:center; outline:none;}
  .field input:disabled{opacity:.6; background:var(--border);}
  .field-error{font-size:9px; font-weight:700; color:var(--red); min-height:11px; margin-top:2px;}
  .hint{font-size:10px; font-weight:600; opacity:.5; margin:0 0 8px;}
  .btn-primary{width:100%; background:var(--pitch); color:var(--chalk); border:none; border-radius:8px; padding:9px; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.02em; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px;}
  .btn-primary:disabled{opacity:.4; cursor:not-allowed;}
  .ventana-row{display:flex; gap:6px; margin-bottom:8px;}
  .ventana-btn{flex:1; padding:6px; font-size:11px; font-weight:700; text-transform:uppercase; border-radius:6px; border:2px solid transparent; cursor:pointer;}
  .type-row{display:flex; gap:6px; margin-bottom:10px;}
  .type-btn{flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; padding:6px; background:var(--field); border-radius:6px; border:2px solid transparent; cursor:pointer;}
  .type-btn span.label{font-size:9px; font-weight:700; text-transform:uppercase; opacity:.75;}
  .card-chip{display:inline-block; width:12px; height:16px; border-radius:2px; vertical-align:middle;}
  .card-chip.double{position:relative; width:18px;}
  .card-chip.double .a{position:absolute; left:0; transform:rotate(-6deg);}
  .card-chip.double .b{position:absolute; left:6px; transform:rotate(6deg);}

  .empty{text-align:center; padding:24px 16px; opacity:.4; font-size:12px;}
  .group-header{display:flex; align-items:center; gap:6px; margin-bottom:4px;}
  .dot{width:10px; height:10px; border-radius:50%; flex-shrink:0; display:inline-block;}
  .group-label{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.02em;}
  .group-divider{border-top:2px solid var(--border); margin-top:4px; padding-top:12px;}
  .event-row{display:flex; align-items:center; justify-content:space-between; padding:6px 0;}
  .event-left{display:flex; align-items:center; gap:8px;}
  .minute-badge{font-family:'Courier New',monospace; font-size:11px; font-weight:700; background:var(--pitch); color:var(--amber); padding:2px 6px; border-radius:4px;}
  .event-text{font-size:14px; font-weight:600;}
  .del-btn{background:none; border:none; color:var(--ink); opacity:.35; cursor:pointer; padding:4px; font-size:15px;}

  .bottom-nav{position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px; display:flex; background:var(--pitch); border-top:1px solid var(--pitch-line); z-index:20;}
  .nav-btn{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; padding:8px 0; background:none; border:none; cursor:pointer; position:relative;}
  .nav-icon{font-size:16px; line-height:1; opacity:.55;}
  .nav-btn.active .nav-icon{opacity:1;}
  .nav-label{font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.02em; color:#5A6E64;}
  .nav-btn.active .nav-label{color:var(--chalk);}
  .nav-badge{position:absolute; top:2px; right:28%; min-width:15px; height:15px; border-radius:50%; background:var(--amber); color:var(--pitch); font-size:9px; font-weight:700; display:flex; align-items:center; justify-content:center; padding:0 3px;}

  .resumen-header{background:var(--pitch); padding:12px 16px; display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:20;}
  .back-btn{background:none; border:none; color:var(--chalk); font-size:20px; cursor:pointer; padding:2px; line-height:1;}
  .resumen-title{font-size:14px; font-weight:700; text-transform:uppercase; letter-spacing:.02em; color:var(--chalk);}
  .resumen-body{padding:16px; max-width:480px; margin:0 auto;}
  .score-card{background:var(--pitch); border-radius:12px; padding:12px; margin-bottom:16px; text-align:center;}
  .score-card .label{font-size:11px; font-weight:700; text-transform:uppercase; color:var(--chalk); opacity:.7; margin-bottom:4px;}
  .score-card .row{display:flex; align-items:center; justify-content:center; gap:12px;}
  .score-card .side{font-size:12px; font-weight:700; text-transform:uppercase; color:var(--chalk); max-width:5.5rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .score-card .sublabel{font-size:10px; font-weight:600; color:var(--chalk); opacity:.5; margin-top:4px;}
  .section{margin-bottom:16px;}
  .section h3{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.02em; opacity:.6; margin:0 0 8px;}
  .section .empty-line{font-size:12px; opacity:.4; margin:0;}
  .group-box{border:1px solid var(--border); border-radius:12px; overflow:hidden;}
  .group-box .g-head{padding:6px 12px;}
  .group-box .g-head span{font-size:10px; font-weight:700; text-transform:uppercase;}
  .group-box .g-body{padding:6px 12px; background:var(--chalk);}
  .group-box .g-body div{font-size:14px; font-weight:600; padding:2px 0;}
  .list-box{border:1px solid var(--border); border-radius:12px; padding:6px 12px; background:var(--chalk);}
  .list-box div{font-size:14px; font-weight:600; padding:2px 0;}
  .archive-btn{width:100%; margin-top:8px; background:var(--amber); color:var(--pitch); border:none; border-radius:8px; padding:10px; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.02em; cursor:pointer;}
  .archive-label{font-size:11px; font-weight:600; opacity:.5; margin:0 0 12px;}

  .archivo-item{width:100%; display:flex; align-items:center; justify-content:space-between; background:var(--field); border:1px solid var(--border); border-radius:12px; padding:12px; margin-bottom:10px; cursor:pointer; text-align:left;}
  .archivo-item .main{font-size:14px; font-weight:700;}
  .archivo-item .sub{font-size:11px; opacity:.5; margin-top:2px;}

  .player-row{display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:1px solid var(--border);}
  .player-row:last-child{border-bottom:none;}
  .player-num{font-family:'Courier New',monospace; font-weight:700; font-size:12px; background:var(--pitch); color:var(--amber); padding:2px 6px; border-radius:4px; min-width:26px; text-align:center; flex-shrink:0;}
  .player-name{flex:1; font-size:14px; font-weight:600; min-width:0;}
  .player-name.strike{text-decoration:line-through; opacity:.55;}
  .sub-in{font-size:12px; font-weight:700; color:var(--green-ok); flex-shrink:0;}
  .player-num.editable, .player-name.editable{cursor:pointer;}
  .player-num.editable{border-bottom:1px dashed var(--pitch-line);}
  .player-name.editable:not(.strike){border-bottom:1px dashed var(--border);}
  button.player-num{all:unset; font-family:'Courier New',monospace; font-weight:700; font-size:12px; background:var(--pitch); color:var(--amber); padding:2px 6px; border-radius:4px; min-width:26px; text-align:center; flex-shrink:0; cursor:pointer; border-bottom:1px dashed var(--amber);}
  button.player-name{all:unset; flex:1; font-size:14px; font-weight:600; min-width:0; cursor:pointer; text-align:left; border-bottom:1px dashed var(--border);}
  button.player-name.strike{text-decoration:line-through; opacity:.55;}
  .inline-edit-num{width:3.2rem; font-family:'Courier New',monospace; font-weight:700; font-size:13px; text-align:center; padding:3px 4px; border:1px solid var(--pitch); border-radius:4px; background:#fff; color:var(--ink); flex-shrink:0;}
  .inline-edit-name{flex:1; min-width:0; font-size:14px; font-weight:600; padding:3px 6px; border:1px solid var(--pitch); border-radius:4px; background:#fff; color:var(--ink);}
  .drag-handle{background:none; border:none; color:var(--ink); opacity:.4; font-size:16px; padding:2px 4px; cursor:pointer; flex-shrink:0; line-height:1;}
  .player-row.dragging{background:var(--field); box-shadow:0 6px 14px rgba(0,0,0,.18); border-radius:8px; opacity:.95;}
  .drag-handle{touch-action:none;}
  .drop-indicator{height:3px; background:var(--amber); border-radius:2px; margin:2px 0;}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  const HOME_NAME = "C.D. Raíces";
  const STORAGE_KEY = "partido-actual";
  const ARCHIVE_KEY = "partidos-archivados";
  const PLANTILLA_KEY = "plantilla-jugadores";
  const VENTANAS = [
    { key: "descanso", short: "Descanso", label: "Descanso", color: "#E85D9E", soft: "#FBE1EE" },
    { key: "1", short: "V1", label: "Ventana 1", color: "#C6362F", soft: "#F6D9D7" },
    { key: "2", short: "V2", label: "Ventana 2", color: "#D19A00", soft: "#FCEFC2" },
    { key: "3", short: "V3", label: "Ventana 3", color: "#2563A6", soft: "#D9E6F2" },
  ];

  function uid(){ return Math.random().toString(36).slice(2,10); }
  function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function formatDateLabel(iso){
    try{ return new Date(iso).toLocaleDateString('es-ES', {day:'2-digit', month:'short', year:'numeric'}); }
    catch(e){ return ''; }
  }
  function cardChip(tipo){
    if(tipo==='amarilla') return `<span class="card-chip" style="background:var(--amber)"></span>`;
    if(tipo==='roja') return `<span class="card-chip" style="background:var(--red)"></span>`;
    return `<span class="card-chip double"><span class="card-chip a" style="background:var(--amber)"></span><span class="card-chip b" style="background:var(--red)"></span></span>`;
  }
  function tipoLabel(t){ return t==='amarilla'?'Amarilla': t==='roja'?'Roja':'2ª amarilla'; }

  let state = {
    view: 'match', tab: 'alineacion',
    awayName: 'Rival', esLocal: true, observaciones: '',
    roster: [], subs: [], cards: [], goals: [], rivalGoals: [],
    archivedMatches: [], openArchiveId: null, plantilla: [],
  };
  let alineacionForm = { numero: '', nombre: '' };
  let editingPlayer = null; // { id, field: 'num' | 'name' }
  let cambiosForm = { ventana: 'descanso', minuto: '', rows: [{entra:'',sale:''},{entra:'',sale:''},{entra:'',sale:''}] };
  let tarjetasForm = { dorsal: '', tipo: 'amarilla', minuto: '' };
  let golesForm = { dorsal: '' };

  function loadState(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        const d = JSON.parse(raw);
        state.awayName = d.awayName ?? 'Rival';
        state.esLocal = d.esLocal ?? true;
        state.observaciones = d.observaciones ?? '';
        state.roster = d.roster ?? [];
        state.subs = d.subs ?? [];
        state.cards = d.cards ?? [];
        state.goals = d.goals ?? [];
        state.rivalGoals = d.rivalGoals ?? [];
      }
    }catch(e){}
    try{
      const raw2 = localStorage.getItem(ARCHIVE_KEY);
      if(raw2) state.archivedMatches = JSON.parse(raw2);
    }catch(e){}
    try{
      const raw3 = localStorage.getItem(PLANTILLA_KEY);
      if(raw3) state.plantilla = JSON.parse(raw3);
    }catch(e){}
    seedRosterFromPlantilla();
  }
  function saveMatch(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        awayName: state.awayName, esLocal: state.esLocal, observaciones: state.observaciones,
        roster: state.roster, subs: state.subs, cards: state.cards, goals: state.goals, rivalGoals: state.rivalGoals
      }));
    }catch(e){}
  }
  function saveArchive(){
    try{ localStorage.setItem(ARCHIVE_KEY, JSON.stringify(state.archivedMatches)); }catch(e){}
  }
  function savePlantilla(){
    try{ localStorage.setItem(PLANTILLA_KEY, JSON.stringify(state.plantilla)); }catch(e){}
  }
  function seedRosterFromPlantilla(){
    if(state.roster.length===0 && state.plantilla.length>0){
      state.roster = state.plantilla.map(p=>({ id:p.id, numero:p.numero, nombre:p.nombre }));
      saveMatch();
    }
  }

  // ---------- router ----------
  function render(){
    const app = document.getElementById('app');
    if(state.view === 'archivo'){ app.innerHTML = renderArchivoView(); attachArchivoEvents(); return; }
    if(state.view === 'archivo-detalle'){
      const m = state.archivedMatches.find(x=>x.id===state.openArchiveId);
      if(!m){ state.view='archivo'; render(); return; }
      app.innerHTML = renderResumen({
        awayName: m.awayName, homeScore: m.homeScore, awayScore: m.awayScore, esLocal: m.esLocal ?? true,
        roster: m.roster ?? [], subs: m.subs, cards: m.cards, goals: m.goals, rivalGoals: m.rivalGoals,
        observaciones: m.observaciones ?? '',
        archivedLabel: `Guardado el ${m.dateLabel}`, showArchiveBtn:false
      });
      attachResumenEvents(false);
      return;
    }
    if(state.view === 'resumen'){
      app.innerHTML = renderResumen({
        awayName: state.awayName, homeScore: state.goals.length, awayScore: state.rivalGoals.length, esLocal: state.esLocal,
        roster: state.roster, subs: state.subs, cards: state.cards, goals: state.goals, rivalGoals: state.rivalGoals,
        observaciones: state.observaciones,
        archivedLabel:null, showArchiveBtn:true
      });
      attachResumenEvents(true);
      return;
    }
    app.innerHTML = renderHeader() + renderTabContent() + renderBottomNav();
    attachHeaderEvents();
    attachBottomNavEvents();
    if(state.tab === 'alineacion') attachAlineacionEvents();
    if(state.tab === 'cambios') attachCambiosEvents();
    if(state.tab === 'tarjetas') attachTarjetasEvents();
    if(state.tab === 'goles') attachGolesEvents();
    if(state.tab === 'observaciones') attachObservacionesEvents();
  }

  // ---------- header ----------
  function renderHeader(){
    const homeScore = state.goals.length, awayScore = state.rivalGoals.length;
    const homeSpan = `<span class="team-name">${esc(HOME_NAME)}</span>`;
    const awayBtn = `<button class="edit-btn" id="edit-away-btn"><span class="name">${esc(state.awayName)}</span> ✎</button>`;
    const leftName = state.esLocal ? homeSpan : awayBtn;
    const rightName = state.esLocal ? awayBtn : homeSpan;
    const leftScore = state.esLocal ? homeScore : awayScore;
    const rightScore = state.esLocal ? awayScore : homeScore;
    return `
    <div class="header">
      <div class="score-row">
        <div style="flex:1;min-width:0;">${leftName}</div>
        <div class="score-box">
          <span class="score-num amber">${leftScore}</span>
          <span class="score-dash">–</span>
          <span class="score-num chalk">${rightScore}</span>
        </div>
        <div style="flex:1;min-width:0;display:flex;justify-content:flex-end;">${rightName}</div>
      </div>
      <div class="side-toggle">
        <button class="side-btn ${state.esLocal?'active':''}" data-local="1">${esc(HOME_NAME)} Local</button>
        <button class="side-btn ${!state.esLocal?'active':''}" data-local="0">${esc(HOME_NAME)} Visitante</button>
      </div>
      <div class="action-row">
        <button class="btn-finish" id="btn-finish">📋 Finalizar partido</button>
        <button class="btn-archive-icon" id="btn-open-archive">🗂 ${state.archivedMatches.length>0?state.archivedMatches.length:''}</button>
      </div>
    </div>`;
  }
  function attachHeaderEvents(){
    document.querySelectorAll('.side-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{ state.esLocal = btn.dataset.local === '1'; saveMatch(); render(); });
    });
    const editBtn = document.getElementById('edit-away-btn');
    if(editBtn){
      editBtn.addEventListener('click', ()=>{
        const val = prompt('Nombre del equipo rival', state.awayName);
        if(val && val.trim()){ state.awayName = val.trim().slice(0,18); saveMatch(); render(); }
      });
    }
    document.getElementById('btn-finish').addEventListener('click', ()=>{ state.view='resumen'; render(); });
    document.getElementById('btn-open-archive').addEventListener('click', ()=>{ state.view='archivo'; render(); });
  }

  // ---------- tabs dispatcher ----------
  function renderTabContent(){
    if(state.tab==='alineacion') return renderAlineacionTab();
    if(state.tab==='cambios') return renderCambiosTab();
    if(state.tab==='tarjetas') return renderTarjetasTab();
    if(state.tab==='goles') return renderGolesTab();
    return renderObservacionesTab();
  }

  // ---------- Alineación ----------
  function renderPlayerLine(p, salidas, roster, readOnly, entradas){
    const rosterList = roster || state.roster;
    const delBtn = readOnly ? '' : `<button class="del-btn" data-del-player="${p.id}">🗑</button>`;
    const handleBtn = readOnly ? '' : `<button class="drag-handle" type="button" data-drag="${p.id}">⠿</button>`;
    const editingNum = !readOnly && editingPlayer && editingPlayer.id===p.id && editingPlayer.field==='num';
    const editingName = !readOnly && editingPlayer && editingPlayer.id===p.id && editingPlayer.field==='name';

    const numHtml = editingNum
      ? `<input type="text" inputmode="numeric" pattern="[0-9]*" class="inline-edit-num" data-inline-num="${p.id}" value="${esc(p.numero)}" maxlength="3">`
      : (readOnly
          ? `<span class="player-num">${esc(p.numero)}</span>`
          : `<button class="player-num" type="button" data-edit-num="${p.id}">${esc(p.numero)}</button>`);

    function nameHtml(prefix, strike, suffix){
      if(editingName) return `<input type="text" class="inline-edit-name" data-inline-name="${p.id}" value="${esc(p.nombre)}" maxlength="24">`;
      const content = `${prefix||''}${esc(p.nombre)}${suffix?` <span style="font-weight:400;opacity:.6;">${suffix}</span>`:''}`;
      if(readOnly) return `<span class="player-name${strike?' strike':''}">${content}</span>`;
      return `<button class="player-name${strike?' strike':''}" type="button" data-edit-name="${p.id}">${content}</button>`;
    }

    const sub = salidas[p.numero];
    if(sub){
      const entraPlayer = rosterList.find(r=>r.numero===sub.entra);
      const entraLabel = entraPlayer ? esc(entraPlayer.nombre) : `Nº ${esc(sub.entra)}`;
      return `<div class="player-row" data-player-id="${p.id}">
        ${handleBtn}
        ${numHtml}
        ${nameHtml('↓ ', true)}
        <span class="sub-in">↑ ${entraLabel}</span>
        ${delBtn}
      </div>`;
    }
    const cameOn = entradas ? entradas[p.numero] : null;
    if(cameOn){
      return `<div class="player-row" data-player-id="${p.id}">
        ${handleBtn}
        ${numHtml}
        ${nameHtml('', true, `en el campo, min ${cameOn.minuto}'`)}
        ${delBtn}
      </div>`;
    }
    return `<div class="player-row" data-player-id="${p.id}">
      ${handleBtn}
      ${numHtml}
      ${nameHtml('', false)}
      ${delBtn}
    </div>`;
  }
  function renderAlineacionList(){
    if(state.roster.length===0) return `<div class="empty">Todavía no has añadido jugadores.</div>`;
    const salidas = {}, entradas = {};
    state.subs.forEach(s=>{ salidas[s.sale] = s; entradas[s.entra] = s; });
    const titulares = state.roster.slice(0,11);
    const suplentes = state.roster.slice(11);
    let html = `<div class="group-header"><span class="group-label" style="color:var(--pitch)">Titulares</span></div>`;

  function attachAlineacionDrag(){
    const listEl = document.getElementById('alineacion-list');
    if(!listEl) return;
    listEl.querySelectorAll('.drag-handle').forEach(handle=>{
      handle.addEventListener('pointerdown', (e)=>{
        e.preventDefault();
        const row = handle.closest('.player-row');
        if(!row) return;
        const playerId = row.dataset.playerId;
        handle.setPointerCapture(e.pointerId);

        const rows = Array.from(listEl.querySelectorAll('.player-row[data-player-id]'));
        const positions = rows.map(r=>{
          const rect = r.getBoundingClientRect();
          return { id: r.dataset.playerId, center: rect.top + rect.height/2 };
        }).filter(p=>p.id!==playerId);

        const rowRect = row.getBoundingClientRect();
        const grabOffset = e.clientY - rowRect.top;
        row.classList.add('dragging');

        const indicatorEl = document.createElement('div');
        indicatorEl.className = 'drop-indicator';

        let targetIndex = 0;

        function computeTargetIndex(y){
          const floatCenter = y - grabOffset + rowRect.height/2;
          for(let i=0;i<positions.length;i++){
            if(floatCenter < positions[i].center) return i;
          }
          return positions.length;
        }
        function placeIndicator(idx){
          if(indicatorEl.parentNode) indicatorEl.parentNode.removeChild(indicatorEl);
          const domOthers = rows.filter(r=>r.dataset.playerId!==playerId);
          if(idx >= domOthers.length){
            if(domOthers.length) domOthers[domOthers.length-1].after(indicatorEl);
            else listEl.appendChild(indicatorEl);
          } else {
            domOthers[idx].before(indicatorEl);
          }
          targetIndex = idx;
        }

        placeIndicator(computeTargetIndex(e.clientY));

        function onMove(ev){
          row.style.transform = `translateY(${ev.clientY - grabOffset - rowRect.top}px)`;
          placeIndicator(computeTargetIndex(ev.clientY));
        }
        function onUp(){
          handle.releasePointerCapture(e.pointerId);
          document.removeEventListener('pointermove', onMove);
          document.removeEventListener('pointerup', onUp);
          row.classList.remove('dragging');
          row.style.transform = '';
          if(indicatorEl.parentNode) indicatorEl.parentNode.removeChild(indicatorEl);

          const others = state.roster.filter(p=>p.id!==playerId);
          const moving = state.roster.find(p=>p.id===playerId);
          if(moving){
            const idx = Math.max(0, Math.min(targetIndex, others.length));
            others.splice(idx, 0, moving);
            state.roster = others;
            saveMatch();
          }
          render();
        }
        document.addEventListener('pointermove', onMove);
        document.addEventListener('pointerup', onUp);
      });
    });
  }
  function attachAlineacionEvents(){
    const numero = document.getElementById('al-numero');
    const nombre = document.getElementById('al-nombre');
    const btnAdd = document.getElementById('btn-add-jugador');
    if(numero && nombre && btnAdd){
      function validate(){
        alineacionForm.numero = numero.value; alineacionForm.nombre = nombre.value;
        btnAdd.disabled = !(numero.value!=='' && nombre.value.trim()!=='');
      }
      numero.addEventListener('input', validate);
      nombre.addEventListener('input', validate);
      validate();
      btnAdd.addEventListener('click', ()=>{
        if(numero.value==='' || nombre.value.trim()==='') return;
        const newId = uid();
        state.roster.push({id:newId, numero:numero.value, nombre:nombre.value.trim()});
        state.plantilla.push({id:newId, numero:numero.value, nombre:nombre.value.trim()});
        savePlantilla();
        saveMatch();
        alineacionForm.numero=''; alineacionForm.nombre='';
        render();
      });
    }
    document.getElementById('alineacion-list').addEventListener('click',(e)=>{
      const delBtn = e.target.closest('[data-del-player]');
      if(delBtn){
        state.roster = state.roster.filter(p=>p.id!==delBtn.dataset.delPlayer);
        state.plantilla = state.plantilla.filter(p=>p.id!==delBtn.dataset.delPlayer);
        savePlantilla(); saveMatch(); editingPlayer=null; render(); return;
      }
      const numBtn = e.target.closest('[data-edit-num]');
      if(numBtn){ editingPlayer = {id:numBtn.dataset.editNum, field:'num'}; render(); return; }
      const nameBtn = e.target.closest('[data-edit-name]');
      if(nameBtn){ editingPlayer = {id:nameBtn.dataset.editName, field:'name'}; render(); return; }
    });
    attachAlineacionDrag();

    if(editingPlayer){
      const input = document.querySelector(`[data-inline-num="${editingPlayer.id}"], [data-inline-name="${editingPlayer.id}"]`);
      if(input){
        input.focus();
        input.select();
        const field = editingPlayer.field;
        const playerId = editingPlayer.id;
        let done = false;
        const commit = ()=>{
          if(done) return;
          done = true;
          const player = state.roster.find(p=>p.id===playerId);
          if(player){
            if(field==='num'){
              const clean = input.value.replace(/[^0-9]/g,'').slice(0,3);
              if(clean !== '') player.numero = clean;
            } else {
              const val = input.value.trim();
              if(val !== '') player.nombre = val.slice(0,24);
            }
            saveMatch();
            const pl = state.plantilla.find(p=>p.id===playerId);
            if(pl){ pl.numero = player.numero; pl.nombre = player.nombre; savePlantilla(); }
          }
          editingPlayer = null;
          render();
        };
        input.addEventListener('blur', commit);
        input.addEventListener('keydown', (e)=>{
          if(e.key==='Enter'){ commit(); }
          if(e.key==='Escape'){ done = true; editingPlayer = null; render(); }
        });
      }
    }
  }

    return groups.map((g,gi)=>`

  function attachCambiosEvents(){
    document.querySelectorAll('.ventana-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        cambiosForm.ventana = btn.dataset.vkey;
        render();
      });
    });
    const fMinuto = document.getElementById('f-minuto');
    const btnAdd = document.getElementById('btn-add-cambio');
    const entraInputs = Array.from(document.querySelectorAll('.cambio-entra'));
    const saleInputs = Array.from(document.querySelectorAll('.cambio-sale'));

    function validateAll(){
      const entrados = new Set(state.subs.map(s=>s.entra));
      const salidos = new Set(state.subs.map(s=>s.sale));
      const titularesNums = new Set(state.roster.slice(0,11).map(p=>p.numero));
      const suplentesNums = new Set(state.roster.slice(11).map(p=>p.numero));
      const rosterNums = new Set(state.roster.map(p=>p.numero));
      const seenEntra = new Set(), seenSale = new Set();
      let anyValid = false, allOk = true;

      cambiosForm.rows.forEach((row, i)=>{
        const entra = row.entra, sale = row.sale;
        let err = '';
        if(entra==='' && sale===''){
          // fila vacía, se ignora
        } else if(entra==='' || sale===''){
          err = 'Rellena entra y sale';
        } else if(entra===sale){
          err = 'No puede coincidir';
        } else if(!rosterNums.has(entra)){
          err = 'Entra: no está en la alineación';
        } else if(titularesNums.has(entra)){
          err = 'Entra: un titular no puede entrar';
        } else if(entrados.has(entra) || salidos.has(entra) || seenEntra.has(entra)){
          err = 'Entra: ya usado';
        } else if(!rosterNums.has(sale)){
          err = 'Sale: no está en la alineación';
        } else if(salidos.has(sale) || seenSale.has(sale)){
          err = 'Sale: ya salió';
        } else if(suplentesNums.has(sale) && !entrados.has(sale)){
          err = 'Sale: este suplente no ha entrado';
        } else {
          seenEntra.add(entra); seenSale.add(sale);
          anyValid = true;
        }
        if(err) allOk = false;
        const errEl = document.getElementById(`err-row-${i}`);
        if(errEl) errEl.textContent = err;
      });

      const ok = anyValid && allOk && fMinuto.value !== '';
      btnAdd.disabled = !ok;
      return ok;
    }

    fMinuto.addEventListener('input', ()=>{ cambiosForm.minuto = fMinuto.value; validateAll(); });
    entraInputs.forEach(inp=>{
      inp.addEventListener('input', ()=>{
        cambiosForm.rows[Number(inp.dataset.row)].entra = inp.value;
        validateAll();
      });
    });
    saleInputs.forEach(inp=>{
      inp.addEventListener('input', ()=>{
        cambiosForm.rows[Number(inp.dataset.row)].sale = inp.value;
        validateAll();
      });
    });
    validateAll();

    btnAdd.addEventListener('click', ()=>{
      if(!validateAll()) return;
      const minuto = fMinuto.value;
      let added = 0;
      cambiosForm.rows.forEach(row=>{
        if(row.entra!=='' && row.sale!==''){
          state.subs.push({id:uid(), ventana:cambiosForm.ventana, entra:row.entra, sale:row.sale, minuto});
          added++;
        }
      });
      if(added===0) return;
      saveMatch();
      cambiosForm.rows = [{entra:'',sale:''},{entra:'',sale:''},{entra:'',sale:''}];
      cambiosForm.minuto = '';
      render();
    });
    document.getElementById('cambios-list').addEventListener('click', (e)=>{
      const btn = e.target.closest('[data-del-sub]');
      if(btn){ state.subs = state.subs.filter(s=>s.id!==btn.dataset.delSub); saveMatch(); render(); }
    });
  }

  }
  function attachObservacionesEvents(){
    const txt = document.getElementById('obs-text');
    txt.addEventListener('input', ()=>{ state.observaciones = txt.value; });
    txt.addEventListener('blur', ()=>{ saveMatch(); });
  }

  // ---------- Resumen ----------
  function renderResumen({awayName, homeScore, awayScore, esLocal, roster, subs, cards, goals, rivalGoals, observaciones, archivedLabel, showArchiveBtn}){
    roster = roster || [];
    const salidas = {}, entradas = {};
    subs.forEach(s=>{ salidas[s.sale] = s; entradas[s.entra] = s; });
    const titulares = roster.slice(0,11);
    const suplentes = roster.slice(11);
    const groups = VENTANAS.map(v=>({...v, items: subs.filter(s=>s.ventana===v.key).sort((a,b)=>Number(a.minuto)-Number(b.minuto))})).filter(g=>g.items.length>0);
    const sortedCards = [...cards].sort((a,b)=>Number(a.minuto)-Number(b.minuto));
    const sortedGoals = [...goals].sort((a,b)=>Number(a.minuto)-Number(b.minuto));
    const sortedRival = [...rivalGoals].sort((a,b)=>Number(a.minuto)-Number(b.minuto));
    const leftName = esLocal? HOME_NAME : awayName;
    const rightName = esLocal? awayName : HOME_NAME;
    const leftScore = esLocal? homeScore : awayScore;
    const rightScore = esLocal? awayScore : homeScore;

    return `
    <div>
      <div class="resumen-header">
        <button class="back-btn" id="resumen-back">←</button>
        <span class="resumen-title">Resumen del partido</span>
      </div>
      <div class="resumen-body">
        ${archivedLabel? `<p class="archive-label">${esc(archivedLabel)}</p>`:''}
        <div class="score-card">
          <div class="label">Resultado final</div>
          <div class="row">
            <span class="side">${esc(leftName)}</span>
            <span class="score-num amber">${leftScore}</span>
            <span class="score-dash">–</span>
            <span class="score-num chalk">${rightScore}</span>
            <span class="side">${esc(rightName)}</span>
          </div>
          <div class="sublabel">${esc(HOME_NAME)} juega como ${esLocal?'local':'visitante'}</div>
        </div>

        <div class="section">
          <h3>Alineación</h3>
          ${roster.length===0? `<p class="empty-line">Sin alineación registrada.</p>` : `
            <div class="list-box">
              ${titulares.map(p=>renderPlayerLine(p, salidas, roster, true, entradas)).join('')}
              ${suplentes.length>0? `<div style="border-top:1px solid var(--border);margin-top:4px;padding-top:4px;">${suplentes.map(p=>renderPlayerLine(p, salidas, roster, true, entradas)).join('')}</div>` : ''}
            </div>
          `}
        </div>

        <div class="section">
          <h3>Cambios</h3>
          ${groups.length===0? `<p class="empty-line">Sin cambios registrados.</p>` : `
            <div class="group-box">
              ${groups.map((g,gi)=>`
                <div style="${gi>0?'border-top:1px solid var(--border)':''}">
                  <div class="g-head" style="background:${g.soft}"><span style="color:${g.color}">${g.label}</span></div>
                  <div class="g-body">
                    ${g.items.map(s=>`<div><span style="font-family:monospace;opacity:.6;margin-right:6px;">${s.minuto}'</span><span style="color:var(--green-ok)">↑${s.entra}</span> <span style="color:var(--red)">↓${s.sale}</span></div>`).join('')}
                  </div>
                </div>
              `).join('')}
            </div>
          `}
        </div>

        <div class="section">
          <h3>Tarjetas</h3>
          ${sortedCards.length===0? `<p class="empty-line">Sin tarjetas registradas.</p>` : `
            <div class="list-box">
              ${sortedCards.map(c=>`<div><span style="font-family:monospace;opacity:.6;margin-right:6px;">${c.minuto}'</span>${cardChip(c.tipo)} Nº ${c.dorsal} <span style="font-weight:400;opacity:.5">· ${tipoLabel(c.tipo)}</span></div>`).join('')}
            </div>
          `}
        </div>

        <div class="section">
          <h3>Goles ${esc(HOME_NAME)}</h3>
          ${sortedGoals.length===0? `<p class="empty-line">Sin goles registrados.</p>` : `
            <div class="list-box">
              ${sortedGoals.map(g=>`<div><span style="font-family:monospace;opacity:.6;margin-right:6px;">${g.minuto}'</span>⚽ Nº ${g.dorsal}</div>`).join('')}
            </div>
          `}
        </div>

        <div class="section">
          <h3>Goles ${esc(awayName)}</h3>
          ${sortedRival.length===0? `<p class="empty-line">Sin goles registrados.</p>` : `
            <div class="list-box">
              ${sortedRival.map(g=>`<div><span style="font-family:monospace;opacity:.6;margin-right:6px;">${g.minuto}'</span>Gol ${esc(awayName)}</div>`).join('')}
            </div>
          `}
        </div>

        <div class="section">
          <h3>Observaciones</h3>
          ${(!observaciones || observaciones.trim()==='')? `<p class="empty-line">Sin observaciones.</p>` : `
            <div class="list-box"><div style="white-space:pre-wrap;">${esc(observaciones)}</div></div>
          `}
        </div>

        ${showArchiveBtn? `<button class="archive-btn" id="btn-archive-match">🗂 Archivar partido</button>`:''}
      </div>
    </div>`;
  }
  function attachResumenEvents(isLive){
    document.getElementById('resumen-back').addEventListener('click', ()=>{
      state.view = isLive ? 'match' : 'archivo';
      render();
    });
    const archiveBtn = document.getElementById('btn-archive-match');
    if(archiveBtn){
      archiveBtn.addEventListener('click', ()=>{
        const nowIso = new Date().toISOString();
        state.archivedMatches.push({
          id: uid(), date: nowIso, dateLabel: formatDateLabel(nowIso),
          awayName: state.awayName, esLocal: state.esLocal, roster: state.roster, observaciones: state.observaciones,
          homeScore: state.goals.length, awayScore: state.rivalGoals.length,
          subs: state.subs, cards: state.cards, goals: state.goals, rivalGoals: state.rivalGoals,
        });
        saveArchive();
        // guarda en la plantilla el orden y los datos finales de este partido
        const rosterIds = new Set(state.roster.map(p=>p.id));
        const reordered = state.roster.map(p=>({ id:p.id, numero:p.numero, nombre:p.nombre }));
        const missing = state.plantilla.filter(pl=>!rosterIds.has(pl.id));
        state.plantilla = [...reordered, ...missing];
        savePlantilla();
        state.awayName = 'Rival'; state.esLocal = true; state.roster = []; state.observaciones = '';
        state.subs = []; state.cards = []; state.goals = []; state.rivalGoals = [];
        seedRosterFromPlantilla();
        saveMatch();
        state.tab = 'alineacion';
        state.view = 'match';
        render();
      });
    }
  }

  // ---------- Archivo ----------
  function renderArchivoView(){
    return `
    <div>
      <div class="resumen-header">
        <button class="back-btn" id="archivo-back">←</button>
        <span class="resumen-title">Partidos guardados</span>
      </div>
      <div class="resumen-body">
        ${state.archivedMatches.length===0? `<div class="empty">Todavía no has archivado ningún partido.</div>` : `
          ${[...state.archivedMatches].sort((a,b)=>new Date(b.date)-new Date(a.date)).map(m=>{
            const eL = m.esLocal ?? true;
            const line = eL
              ? `${esc(HOME_NAME)} ${m.homeScore} – ${m.awayScore} ${esc(m.awayName)}`
              : `${esc(m.awayName)} ${m.awayScore} – ${m.homeScore} ${esc(HOME_NAME)}`;
            return `
            <button class="archivo-item" data-open="${m.id}">
              <div>
                <div class="main">${line}</div>
                <div class="sub">${esc(m.dateLabel)}</div>
              </div>
              <span style="opacity:.4;">›</span>
            </button>`;
          }).join('')}
        `}
      </div>
    </div>`;
  }
  function attachArchivoEvents(){
    document.getElementById('archivo-back').addEventListener('click', ()=>{ state.view='match'; render(); });
    document.querySelectorAll('[data-open]').forEach(btn=>{
      btn.addEventListener('click', ()=>{ state.openArchiveId = btn.dataset.open; state.view='archivo-detalle'; render(); });
    });
  }

  loadState();
  render();
})();
</script>
</body>
</html>
