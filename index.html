<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Control de Partido — C.D. Raíces</title>
<link rel="icon" href="data:,">
<style>
  :root{
    --brand:#0B3D2E; --brand-2:#15664A; --brand-ink:#082A20;
    --accent:#F2B705; --danger:#C6362F; --ok:#1E8E3E; --rival:#5B6B6B;
    --bg:#F4F2EC; --surface:#FFFFFF; --surface-2:#F6F4EE;
    --ink:#15201B; --muted:#746C5E; --border:#E7E2D5;
    --r-lg:20px; --r-md:14px; --r-sm:10px;
    --shadow-sm:0 1px 3px rgba(20,20,10,.08);
    --shadow-md:0 8px 24px rgba(20,20,10,.12);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--ink);}
  button{font-family:inherit;}
  button:active{transform:scale(.96);}
  #app{max-width:480px; margin:0 auto; min-height:100vh; background:var(--bg); position:relative; padding-bottom:84px;}

  @keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
  .tab-content{animation:fadeIn .22s ease; padding:14px 16px 90px;}

  /* ---- Header ---- */
  .header{background:linear-gradient(135deg, var(--brand), var(--brand-2)); padding:16px 16px 12px; position:sticky; top:0; z-index:30; border-radius:0 0 var(--r-lg) var(--r-lg); box-shadow:var(--shadow-md);}
  .score-row{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .team-name{flex:1; min-width:0; font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:.03em; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .team-name.right{text-align:right;}
  .score-box{display:flex; align-items:baseline; gap:5px; background:rgba(0,0,0,.22); border-radius:999px; padding:5px 16px; flex-shrink:0;}
  .score-num{font-variant-numeric:tabular-nums; font-size:26px; font-weight:800; font-family:'SF Mono','Courier New',monospace;}
  .score-num.amber{color:var(--accent);}
  .score-num.chalk{color:#fff;}
  .score-dash{color:#fff; opacity:.45; font-size:15px; font-weight:700;}
  .edit-btn{display:flex; align-items:center; gap:4px; background:none; border:none; color:#fff; font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:.03em; cursor:pointer; padding:0; max-width:100%;}
  .edit-btn span.name{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:6.5rem; display:inline-block;}
  .side-toggle{display:flex; gap:6px; margin-top:12px; background:rgba(0,0,0,.18); border-radius:999px; padding:3px;}
  .side-btn{flex:1; padding:7px; font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.02em; border-radius:999px; border:none; background:transparent; color:rgba(255,255,255,.7); cursor:pointer; transition:background .15s;}
  .side-btn.active{background:var(--accent); color:var(--brand-ink);}
  .action-row{display:flex; gap:8px; margin-top:10px;}
  .btn-finish{flex:1; background:var(--accent); color:var(--brand-ink); border:none; border-radius:999px; padding:10px; font-size:12.5px; font-weight:800; text-transform:uppercase; letter-spacing:.02em; cursor:pointer; box-shadow:var(--shadow-sm); display:flex; align-items:center; justify-content:center; gap:6px;}
  .btn-archive-icon{background:rgba(255,255,255,.14); border:none; color:#fff; border-radius:999px; padding:10px 14px; font-size:12.5px; font-weight:800; cursor:pointer;}

  /* ---- Cards & layout ---- */
  .card{background:var(--surface); border-radius:var(--r-md); padding:14px; margin-bottom:14px; box-shadow:var(--shadow-sm);}
  .card.soft{background:var(--surface-2);}
  .field-row{display:flex; gap:8px; margin-bottom:9px;}
  .field{flex:1; min-width:0; display:flex; flex-direction:column; gap:3px;}
  .field label{font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.03em; color:var(--muted);}
  .field input, .field textarea{width:100%; border:1.5px solid var(--border); background:var(--surface-2); border-radius:var(--r-sm); padding:9px 8px; font-size:16px; font-weight:700; text-align:center; outline:none; transition:border-color .15s;}
  .field input:focus, .field textarea:focus{border-color:var(--brand);}
  .field input:disabled{opacity:.55; background:var(--border);}
  .field-error{font-size:10.5px; font-weight:700; color:var(--danger); min-height:13px; margin-top:3px;}
  .hint{font-size:11px; font-weight:600; color:var(--muted); margin:0 0 10px; line-height:1.4;}

  .btn-primary{width:100%; background:var(--brand); color:#fff; border:none; border-radius:var(--r-sm); padding:12px; font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:.02em; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:7px; box-shadow:var(--shadow-sm); transition:opacity .15s;}
  .btn-primary:disabled{opacity:.35; cursor:not-allowed; box-shadow:none;}
  .btn-ghost{background:none; border:1.5px dashed var(--border); color:var(--brand); border-radius:var(--r-sm); padding:9px; font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.02em; cursor:pointer; width:100%;}
  .btn-link{background:none; border:none; color:var(--danger); font-size:11px; font-weight:800; cursor:pointer; padding:4px 6px;}

  .ventana-row{display:flex; gap:6px; margin-bottom:8px;}
  .ventana-btn{flex:1; padding:8px; font-size:11px; font-weight:800; text-transform:uppercase; border-radius:var(--r-sm); border:2px solid transparent; cursor:pointer; transition:transform .1s;}
  .type-row{display:flex; gap:6px; margin-bottom:12px;}
  .type-btn{flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; padding:9px 6px; background:var(--surface-2); border-radius:var(--r-sm); border:2px solid transparent; cursor:pointer;}
  .type-btn span.label{font-size:9.5px; font-weight:800; text-transform:uppercase; color:var(--muted);}
  .card-chip{display:inline-block; width:12px; height:16px; border-radius:2px; vertical-align:middle;}
  .card-chip.double{position:relative; width:18px;}
  .card-chip.double .a{position:absolute; left:0; transform:rotate(-6deg);}
  .card-chip.double .b{position:absolute; left:6px; transform:rotate(6deg);}

  /* ---- Chip picker ---- */
  .picker-field{width:100%; text-align:left; border:1.5px solid var(--border); background:var(--surface-2); border-radius:var(--r-sm); padding:10px 12px; font-size:13.5px; font-weight:800; color:var(--ink); display:flex; justify-content:space-between; align-items:center; cursor:pointer; gap:8px;}
  .picker-field.filled{border-color:var(--brand); background:#fff;}
  .picker-field .ph{opacity:.4; font-weight:600;}
  .picker-field .chev{opacity:.4; font-size:11px; flex-shrink:0;}
  .picker-panel{background:var(--surface-2); border-radius:var(--r-sm); padding:10px; margin-top:6px; border:1.5px solid var(--border);}
  .chip-grid{display:flex; flex-wrap:wrap; gap:7px;}
  .chip{padding:7px 12px; border-radius:999px; border:1.5px solid var(--border); background:#fff; font-size:12.5px; font-weight:800; color:var(--ink); cursor:pointer; display:flex; align-items:center; gap:6px;}
  .chip .cn{font-family:'SF Mono','Courier New',monospace; background:var(--brand); color:var(--accent); border-radius:999px; padding:1px 6px; font-size:10.5px;}
  .chip.selected{background:var(--brand); border-color:var(--brand); color:#fff;}
  .chip.selected .cn{background:var(--accent); color:var(--brand-ink);}
  .chip-empty{font-size:11.5px; color:var(--muted); padding:6px 2px;}

  .row-block{background:var(--surface-2); border-radius:var(--r-sm); padding:10px; margin-bottom:8px;}
  .row-block-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;}
  .row-block-head span{font-size:10px; font-weight:800; text-transform:uppercase; color:var(--muted);}

  .empty{text-align:center; padding:28px 16px; color:var(--muted); font-size:12.5px;}
  .group-header{display:flex; align-items:center; gap:7px; margin:4px 0 6px;}
  .dot{width:9px; height:9px; border-radius:50%; flex-shrink:0; display:inline-block;}
  .group-label{font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.02em;}
  .group-divider{margin-top:6px; padding-top:12px; border-top:1.5px solid var(--border);}
  .event-row{display:flex; align-items:center; justify-content:space-between; padding:7px 0;}
  .event-left{display:flex; align-items:center; gap:8px; min-width:0;}
  .minute-badge{font-family:'SF Mono','Courier New',monospace; font-size:10.5px; font-weight:800; background:var(--brand); color:var(--accent); padding:2px 7px; border-radius:999px; flex-shrink:0;}
  .event-text{font-size:13.5px; font-weight:700;}
  .del-btn{background:none; border:none; color:var(--muted); cursor:pointer; padding:5px; font-size:14px; flex-shrink:0;}

  /* ---- Player rows (Alineación) ---- */
  .player-row{display:flex; align-items:center; gap:7px; padding:8px 2px; border-bottom:1px solid var(--border);}
  .player-row:last-child{border-bottom:none;}
  .player-num{font-family:'SF Mono','Courier New',monospace; font-weight:800; font-size:11.5px; background:var(--brand); color:var(--accent); padding:3px 7px; border-radius:999px; min-width:28px; text-align:center; flex-shrink:0; border:none;}
  .player-name{flex:1; font-size:13.5px; font-weight:700; min-width:0; text-align:left; background:none; border:none; color:var(--ink); padding:0;}
  .player-name.strike{text-decoration:line-through; opacity:.5;}
  .sub-in{font-size:11px; font-weight:800; color:var(--ok); flex-shrink:0;}
  .inline-edit-num{width:3.2rem; font-family:'SF Mono','Courier New',monospace; font-weight:800; font-size:13px; text-align:center; padding:4px; border:1.5px solid var(--brand); border-radius:var(--r-sm); background:#fff; color:var(--ink); flex-shrink:0;}
  .inline-edit-name{flex:1; min-width:0; font-size:13.5px; font-weight:700; padding:4px 7px; border:1.5px solid var(--brand); border-radius:var(--r-sm); background:#fff; color:var(--ink);}
  .drag-handle{background:none; border:none; color:var(--muted); font-size:17px; padding:2px 4px; cursor:grab; flex-shrink:0; line-height:1; touch-action:none;}
  .player-row.dragging{background:var(--surface-2); box-shadow:var(--shadow-md); border-radius:var(--r-sm); opacity:.96;}
  .drop-indicator{height:3px; background:var(--accent); border-radius:2px; margin:2px 0;}

  /* ---- Bottom nav ---- */
  .bottom-nav{position:fixed; bottom:12px; left:50%; transform:translateX(-50%); width:calc(100% - 24px); max-width:456px; display:flex; background:var(--brand); border-radius:999px; box-shadow:var(--shadow-md); z-index:30; padding:5px;}
  .nav-btn{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; padding:8px 2px; background:none; border:none; cursor:pointer; position:relative; border-radius:999px; transition:background .15s;}
  .nav-btn.active{background:rgba(255,255,255,.14);}
  .nav-icon{font-size:15px; line-height:1; opacity:.6;}
  .nav-btn.active .nav-icon{opacity:1;}
  .nav-label{font-size:9px; font-weight:800; text-transform:uppercase; letter-spacing:.01em; color:rgba(255,255,255,.5);}
  .nav-btn.active .nav-label{color:#fff;}
  .nav-badge{position:absolute; top:1px; right:14%; min-width:14px; height:14px; border-radius:50%; background:var(--accent); color:var(--brand-ink); font-size:8.5px; font-weight:800; display:flex; align-items:center; justify-content:center; padding:0 3px;}

  /* ---- Resumen / Archivo ---- */
  .resumen-header{background:linear-gradient(135deg, var(--brand), var(--brand-2)); padding:14px 16px; display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:30; border-radius:0 0 var(--r-lg) var(--r-lg); box-shadow:var(--shadow-md);}
  .back-btn{background:rgba(255,255,255,.14); border:none; color:#fff; font-size:16px; cursor:pointer; padding:6px 10px; line-height:1; border-radius:999px;}
  .resumen-title{font-size:13.5px; font-weight:800; text-transform:uppercase; letter-spacing:.02em; color:#fff;}
  .resumen-body{padding:16px; max-width:480px; margin:0 auto;}
  .score-card{background:linear-gradient(135deg, var(--brand), var(--brand-2)); border-radius:var(--r-md); padding:16px; margin-bottom:16px; text-align:center; box-shadow:var(--shadow-sm);}
  .score-card .label{font-size:10.5px; font-weight:800; text-transform:uppercase; color:rgba(255,255,255,.7); margin-bottom:6px;}
  .score-card .row{display:flex; align-items:center; justify-content:center; gap:12px;}
  .score-card .side{font-size:11.5px; font-weight:800; text-transform:uppercase; color:#fff; max-width:5.5rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .score-card .sublabel{font-size:10px; font-weight:700; color:rgba(255,255,255,.65); margin-top:6px;}
  .section{margin-bottom:18px;}
  .section h3{font-size:11.5px; font-weight:800; text-transform:uppercase; letter-spacing:.02em; color:var(--muted); margin:0 0 8px;}
  .section .empty-line{font-size:12px; color:var(--muted); margin:0;}
  .group-box{background:var(--surface); border-radius:var(--r-md); overflow:hidden; box-shadow:var(--shadow-sm);}
  .group-box .g-head{padding:7px 13px;}
  .group-box .g-head span{font-size:10px; font-weight:800; text-transform:uppercase;}
  .group-box .g-body{padding:7px 13px; background:var(--surface);}
  .group-box .g-body div{font-size:13.5px; font-weight:700; padding:3px 0;}
  .list-box{border-radius:var(--r-md); padding:7px 13px; background:var(--surface); box-shadow:var(--shadow-sm);}
  .list-box div{font-size:13.5px; font-weight:700; padding:3px 0;}
  .archive-btn{width:100%; margin-top:10px; background:var(--accent); color:var(--brand-ink); border:none; border-radius:var(--r-sm); padding:13px; font-size:12.5px; font-weight:800; text-transform:uppercase; letter-spacing:.02em; cursor:pointer; box-shadow:var(--shadow-sm);}
  .archive-label{font-size:11px; font-weight:700; color:var(--muted); margin:0 0 12px;}

  .archivo-item{width:100%; display:flex; align-items:center; justify-content:space-between; background:var(--surface); border-radius:var(--r-md); padding:14px; margin-bottom:10px; cursor:pointer; text-align:left; box-shadow:var(--shadow-sm); border:none;}
  .archivo-item .main{font-size:13.5px; font-weight:800;}
  .archivo-item .sub{font-size:10.5px; color:var(--muted); margin-top:3px;}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  const HOME_NAME = "C.D. Raíces";
  const STORAGE_KEY = "partido-actual";
  const ARCHIVE_KEY = "partidos-archivados";
  const PLANTILLA_KEY = "plantilla-jugadores";
  const VENTANAS = [
    { key: "descanso", short: "Descanso", label: "Descanso", color: "#E85D9E", soft: "#FBE1EE" },
    { key: "1", short: "V1", label: "Ventana 1", color: "#C6362F", soft: "#F6D9D7" },
    { key: "2", short: "V2", label: "Ventana 2", color: "#D19A00", soft: "#FCEFC2" },
    { key: "3", short: "V3", label: "Ventana 3", color: "#2563A6", soft: "#D9E6F2" },
  ];

  function uid(){ return Math.random().toString(36).slice(2,10); }
  function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function formatDateLabel(iso){
    try{ return new Date(iso).toLocaleDateString('es-ES', {day:'2-digit', month:'short', year:'numeric'}); }
    catch(e){ return ''; }
  }
  function cardChip(tipo){
    if(tipo==='amarilla') return `<span class="card-chip" style="background:var(--accent)"></span>`;
    if(tipo==='roja') return `<span class="card-chip" style="background:var(--danger)"></span>`;
    return `<span class="card-chip double"><span class="card-chip a" style="background:var(--accent)"></span><span class="card-chip b" style="background:var(--danger)"></span></span>`;
  }
  function tipoLabel(t){ return t==='amarilla'?'Amarilla': t==='roja'?'Roja':'2ª amarilla'; }

  let state = {
    view: 'match', tab: 'alineacion',
    awayName: 'Rival', esLocal: true, observaciones: '',
    roster: [], subs: [], cards: [], goals: [], rivalGoals: [],
    archivedMatches: [], openArchiveId: null, plantilla: [],
  };
  let alineacionForm = { numero: '', nombre: '' };
  let editingPlayer = null; // { id, field: 'num' | 'name' }
  let cambiosForm = { ventana: 'descanso', minuto: '', rows: [{entra:'',sale:''}] };
  let openCambioPicker = null; // { row, field: 'entra'|'sale' }
  let tarjetasForm = { dorsal: '', tipo: 'amarilla', minuto: '' };
  let golesForm = { dorsal: '', minuto: '' };

  function loadState(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        const d = JSON.parse(raw);
        state.awayName = d.awayName ?? 'Rival';
        state.esLocal = d.esLocal ?? true;
        state.observaciones = d.observaciones ?? '';
        state.roster = d.roster ?? [];
        state.subs = d.subs ?? [];
        state.cards = d.cards ?? [];
        state.goals = d.goals ?? [];
        state.rivalGoals = d.rivalGoals ?? [];
      }
    }catch(e){}
    try{
      const raw2 = localStorage.getItem(ARCHIVE_KEY);
      if(raw2) state.archivedMatches = JSON.parse(raw2);
    }catch(e){}
    try{
      const raw3 = localStorage.getItem(PLANTILLA_KEY);
      if(raw3) state.plantilla = JSON.parse(raw3);
    }catch(e){}
    seedRosterFromPlantilla();
  }
  function saveMatch(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        awayName: state.awayName, esLocal: state.esLocal, observaciones: state.observaciones,
        roster: state.roster, subs: state.subs, cards: state.cards, goals: state.goals, rivalGoals: state.rivalGoals
      }));
    }catch(e){}
  }
  function saveArchive(){
    try{ localStorage.setItem(ARCHIVE_KEY, JSON.stringify(state.archivedMatches)); }catch(e){}
  }
  function savePlantilla(){
    try{ localStorage.setItem(PLANTILLA_KEY, JSON.stringify(state.plantilla)); }catch(e){}
  }
  function seedRosterFromPlantilla(){
    if(state.roster.length===0 && state.plantilla.length>0){
      state.roster = state.plantilla.map(p=>({ id:p.id, numero:p.numero, nombre:p.nombre }));
      saveMatch();
    }
  }

  // ---------- router ----------
  function render(){
    const app = document.getElementById('app');
    if(state.view === 'archivo'){ app.innerHTML = renderArchivoView(); attachArchivoEvents(); return; }
    if(state.view === 'archivo-detalle'){
      const m = state.archivedMatches.find(x=>x.id===state.openArchiveId);
      if(!m){ state.view='archivo'; render(); return; }
      app.innerHTML = renderResumen({
        awayName: m.awayName, homeScore: m.homeScore, awayScore: m.awayScore, esLocal: m.esLocal ?? true,
        roster: m.roster ?? [], subs: m.subs, cards: m.cards, goals: m.goals, rivalGoals: m.rivalGoals,
        observaciones: m.observaciones ?? '',
        archivedLabel: `Guardado el ${m.dateLabel}`, showArchiveBtn:false
      });
      attachResumenEvents(false);
      return;
    }
    if(state.view === 'resumen'){
      app.innerHTML = renderResumen({
        awayName: state.awayName, homeScore: state.goals.length, awayScore: state.rivalGoals.length, esLocal: state.esLocal,
        roster: state.roster, subs: state.subs, cards: state.cards, goals: state.goals, rivalGoals: state.rivalGoals,
        observaciones: state.observaciones,
        archivedLabel:null, showArchiveBtn:true
      });
      attachResumenEvents(true);
      return;
    }
    app.innerHTML = renderHeader() + renderTabContent() + renderBottomNav();
    attachHeaderEvents();
    attachBottomNavEvents();
    if(state.tab === 'alineacion') attachAlineacionEvents();
    if(state.tab === 'cambios') attachCambiosEvents();
    if(state.tab === 'tarjetas') attachTarjetasEvents();
    if(state.tab === 'goles') attachGolesEvents();
    if(state.tab === 'observaciones') attachObservacionesEvents();
  }

  function convocados(){ return state.roster.slice(0,18); }

  // ---------- header ----------
  function renderHeader(){
    const homeScore = state.goals.length, awayScore = state.rivalGoals.length;
    const homeSpan = `<span class="team-name">${esc(HOME_NAME)}</span>`;
    const awayBtn = `<button class="edit-btn" id="edit-away-btn"><span class="name">${esc(state.awayName)}</span> ✎</button>`;
    const leftName = state.esLocal ? homeSpan : awayBtn;
    const rightName = state.esLocal ? awayBtn : homeSpan;
    const leftScore = state.esLocal ? homeScore : awayScore;
    const rightScore = state.esLocal ? awayScore : homeScore;
    return `
    <div class="header">
      <div class="score-row">
        <div style="flex:1;min-width:0;">${leftName}</div>
        <div class="score-box">
          <span class="score-num amber">${leftScore}</span>
          <span class="score-dash">–</span>
          <span class="score-num chalk">${rightScore}</span>
        </div>
        <div style="flex:1;min-width:0;display:flex;justify-content:flex-end;">${rightName}</div>
      </div>
      <div class="side-toggle">
        <button class="side-btn ${state.esLocal?'active':''}" data-local="1">${esc(HOME_NAME)} Local</button>
        <button class="side-btn ${!state.esLocal?'active':''}" data-local="0">${esc(HOME_NAME)} Visitante</button>
      </div>
      <div class="action-row">
        <button class="btn-finish" id="btn-finish">📋 Finalizar partido</button>
        <button class="btn-archive-icon" id="btn-open-archive">🗂 ${state.archivedMatches.length>0?state.archivedMatches.length:''}</button>
      </div>
    </div>`;
  }
  function attachHeaderEvents(){
    document.querySelectorAll('.side-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{ state.esLocal = btn.dataset.local === '1'; saveMatch(); render(); });
    });
    const editBtn = document.getElementById('edit-away-btn');
    if(editBtn){
      editBtn.addEventListener('click', ()=>{
        const val = prompt('Nombre del equipo rival', state.awayName);
        if(val && val.trim()){ state.awayName = val.trim().slice(0,18); saveMatch(); render(); }
      });
    }

  // ---------- Alineación ----------
  function renderPlayerLine(p, salidas, roster, readOnly, entradas){
    const rosterList = roster || state.roster;
    const delBtn = readOnly ? '' : `<button class="del-btn" data-del-player="${p.id}">🗑</button>`;
    const handleBtn = readOnly ? '' : `<button class="drag-handle" type="button" data-drag="${p.id}">⠿</button>`;
    const editingNum = !readOnly && editingPlayer && editingPlayer.id===p.id && editingPlayer.field==='num';
    const editingName = !readOnly && editingPlayer && editingPlayer.id===p.id && editingPlayer.field==='name';

    const numHtml = editingNum
      ? `<input type="text" inputmode="numeric" pattern="[0-9]*" class="inline-edit-num" data-inline-num="${p.id}" value="${esc(p.numero)}" maxlength="3">`
      : (readOnly
          ? `<span class="player-num">${esc(p.numero)}</span>`
          : `<button class="player-num" type="button" data-edit-num="${p.id}">${esc(p.numero)}</button>`);

    function nameHtml(prefix, strike, suffix){
      if(editingName) return `<input type="text" class="inline-edit-name" data-inline-name="${p.id}" value="${esc(p.nombre)}" maxlength="24">`;
      const content = `${prefix||''}${esc(p.nombre)}${suffix?` <span style="font-weight:500;opacity:.65;">${suffix}</span>`:''}`;
      if(readOnly) return `<span class="player-name${strike?' strike':''}">${content}</span>`;
      return `<button class="player-name${strike?' strike':''}" type="button" data-edit-name="${p.id}">${content}</button>`;
    }

    const sub = salidas[p.numero];
    if(sub){
      const entraPlayer = rosterList.find(r=>r.numero===sub.entra);
      const entraLabel = entraPlayer ? esc(entraPlayer.nombre) : `Nº ${esc(sub.entra)}`;
      return `<div class="player-row" data-player-id="${p.id}">
        ${handleBtn}
        ${numHtml}
        ${nameHtml('↓ ', true)}
        <span class="sub-in">↑ ${entraLabel}</span>
        ${delBtn}
      </div>`;
    }
    const cameOn = entradas ? entradas[p.numero] : null;
    if(cameOn){
      return `<div class="player-row" data-player-id="${p.id}">
        ${handleBtn}
        ${numHtml}
        ${nameHtml('', true, `en el campo, min ${cameOn.minuto}'`)}
        ${delBtn}
      </div>`;
    }
    return `<div class="player-row" data-player-id="${p.id}">
      ${handleBtn}
      ${numHtml}
      ${nameHtml('', false)}
      ${delBtn}
    </div>`;
  }
  function renderAlineacionList(){
    if(state.roster.length===0) return `<div class="empty">Todavía no has añadido jugadores.</div>`;
    const salidas = {}, entradas = {};
    state.subs.forEach(s=>{ salidas[s.sale] = s; entradas[s.entra] = s; });
    const titulares = state.roster.slice(0,11);
    const suplentes = state.roster.slice(11,18);
    const noConvocados = state.roster.slice(18);
    let html = `<div class="group-header"><span class="dot" style="background:var(--brand)"></span><span class="group-label" style="color:var(--brand)">Titulares (${titulares.length}/11)</span></div>`;
    html += titulares.map(p=>renderPlayerLine(p, salidas, state.roster, false, entradas)).join('');
    if(suplentes.length>0){
      html += `<div class="group-divider">
        <div class="group-header"><span class="dot" style="background:var(--rival)"></span><span class="group-label" style="color:var(--rival)">Suplentes (${suplentes.length}/7)</span></div>
        ${suplentes.map(p=>renderPlayerLine(p, salidas, state.roster, false, entradas)).join('')}

  function renderAlineacionTab(){
    return `
    <div class="tab-content">
      <div class="card">
        <div class="field-row">
          <div class="field" style="flex:0 0 4.5rem;"><label>Dorsal</label><input type="text" inputmode="numeric" pattern="[0-9]*" id="al-numero" value="${esc(alineacionForm.numero)}" placeholder="—" maxlength="3" onfocus="this.select()"></div>
          <div class="field"><label>Nombre</label><input type="text" id="al-nombre" value="${esc(alineacionForm.nombre)}" placeholder="Nombre del jugador" maxlength="24" onfocus="this.select()"></div>

        <button class="btn-primary" id="btn-add-jugador" disabled>+ Añadir a la plantilla</button>
      </div>
      <p class="hint">Se guarda para siempre: la próxima vez no hace falta volver a escribirlos. 11 titulares, hasta 7 suplentes, el resto no convocados. Mantén pulsado ⠿ y desliza para reordenar.</p>

  function attachAlineacionDrag(){
    const listEl = document.getElementById('alineacion-list');
    if(!listEl) return;
    listEl.querySelectorAll('.drag-handle').forEach(handle=>{
      handle.addEventListener('pointerdown', (e)=>{
        e.preventDefault();
        const row = handle.closest('.player-row');
        if(!row) return;
        const playerId = row.dataset.playerId;
        handle.setPointerCapture(e.pointerId);

        const rows = Array.from(listEl.querySelectorAll('.player-row[data-player-id]'));
        const positions = rows.map(r=>{
          const rect = r.getBoundingClientRect();
          return { id: r.dataset.playerId, center: rect.top + rect.height/2 };
        }).filter(p=>p.id!==playerId);

        const rowRect = row.getBoundingClientRect();
        const grabOffset = e.clientY - rowRect.top;
        row.classList.add('dragging');

        const indicatorEl = document.createElement('div');
        indicatorEl.className = 'drop-indicator';

        let targetIndex = 0;

        function computeTargetIndex(y){
          const floatCenter = y - grabOffset + rowRect.height/2;
          for(let i=0;i<positions.length;i++){
            if(floatCenter < positions[i].center) return i;
          }
          return positions.length;
        }
        function placeIndicator(idx){
          if(indicatorEl.parentNode) indicatorEl.parentNode.removeChild(indicatorEl);
          const domOthers = rows.filter(r=>r.dataset.playerId!==playerId);
          if(idx >= domOthers.length){
            if(domOthers.length) domOthers[domOthers.length-1].after(indicatorEl);
            else listEl.appendChild(indicatorEl);
          } else {
            domOthers[idx].before(indicatorEl);
          }
          targetIndex = idx;
        }

        placeIndicator(computeTargetIndex(e.clientY));

        function onMove(ev){
          row.style.transform = `translateY(${ev.clientY - grabOffset - rowRect.top}px)`;
          placeIndicator(computeTargetIndex(ev.clientY));
        }
        function onUp(){
          handle.releasePointerCapture(e.pointerId);
          document.removeEventListener('pointermove', onMove);
          document.removeEventListener('pointerup', onUp);
          row.classList.remove('dragging');
          row.style.transform = '';
          if(indicatorEl.parentNode) indicatorEl.parentNode.removeChild(indicatorEl);

          const others = state.roster.filter(p=>p.id!==playerId);
          const moving = state.roster.find(p=>p.id===playerId);
          if(moving){
            const idx = Math.max(0, Math.min(targetIndex, others.length));
            others.splice(idx, 0, moving);
            state.roster = others;
            saveMatch();
          }
          render();
        }
        document.addEventListener('pointermove', onMove);
        document.addEventListener('pointerup', onUp);
      });
    });
  }
  function attachAlineacionEvents(){
    const numero = document.getElementById('al-numero');
    const nombre = document.getElementById('al-nombre');
    const btnAdd = document.getElementById('btn-add-jugador');
    if(numero && nombre && btnAdd){
      function validate(){
        alineacionForm.numero = numero.value; alineacionForm.nombre = nombre.value;
        btnAdd.disabled = !(numero.value!=='' && nombre.value.trim()!=='');
      }
      numero.addEventListener('input', validate);
      nombre.addEventListener('input', validate);
      validate();
      btnAdd.addEventListener('click', ()=>{
        if(numero.value==='' || nombre.value.trim()==='') return;
        const newId = uid();
        state.roster.push({id:newId, numero:numero.value, nombre:nombre.value.trim()});
        state.plantilla.push({id:newId, numero:numero.value, nombre:nombre.value.trim()});
        savePlantilla();
        saveMatch();
        alineacionForm.numero=''; alineacionForm.nombre='';
        render();
      });
    }
    document.getElementById('alineacion-list').addEventListener('click',(e)=>{
      const delBtn = e.target.closest('[data-del-player]');
      if(delBtn){
        state.roster = state.roster.filter(p=>p.id!==delBtn.dataset.delPlayer);
        state.plantilla = state.plantilla.filter(p=>p.id!==delBtn.dataset.delPlayer);
        savePlantilla(); saveMatch(); editingPlayer=null; render(); return;
      }
      const numBtn = e.target.closest('[data-edit-num]');
      if(numBtn){ editingPlayer = {id:numBtn.dataset.editNum, field:'num'}; render(); return; }
      const nameBtn = e.target.closest('[data-edit-name]');
      if(nameBtn){ editingPlayer = {id:nameBtn.dataset.editName, field:'name'}; render(); return; }
    });
    attachAlineacionDrag();

    if(editingPlayer){
      const input = document.querySelector(`[data-inline-num="${editingPlayer.id}"], [data-inline-name="${editingPlayer.id}"]`);
      if(input){
        input.focus();
        input.select();
        const field = editingPlayer.field;
        const playerId = editingPlayer.id;
        let done = false;
        const commit = ()=>{
          if(done) return;
          done = true;
          const player = state.roster.find(p=>p.id===playerId);
          if(player){
            if(field==='num'){
              const clean = input.value.replace(/[^0-9]/g,'').slice(0,3);
              if(clean !== '') player.numero = clean;
            } else {
              const val = input.value.trim();
              if(val !== '') player.nombre = val.slice(0,24);
            }
            saveMatch();
            const pl = state.plantilla.find(p=>p.id===playerId);
            if(pl){ pl.numero = player.numero; pl.nombre = player.nombre; savePlantilla(); }
          }
          editingPlayer = null;
          render();
        };
        input.addEventListener('blur', commit);
        input.addEventListener('keydown', (e)=>{
          if(e.key==='Enter'){ commit(); }
          if(e.key==='Escape'){ done = true; editingPlayer = null; render(); }
        });
      }
    }
  }

  // ---------- Cambios (con selector de jugadores) ----------
  function computeVentanaMinuto(subs){
    const m = {};
    subs.forEach(s=>{ if(m[s.ventana]===undefined) m[s.ventana]=s.minuto; });
    return m;
  }
  function cambiosEligibility(){
    const entrados = new Set(state.subs.map(s=>s.entra));
    const salidos = new Set(state.subs.map(s=>s.sale));
    const titulares = state.roster.slice(0,11);
    const suplentes = state.roster.slice(11,18);
    return {
      entrados, salidos,
      titularesNums: new Set(titulares.map(p=>p.numero)),
      todos: [...titulares, ...suplentes],
    };
  }
  function usedInOtherRows(rowIndex){
    const used = new Set();
    cambiosForm.rows.forEach((r,i)=>{ if(i!==rowIndex){ if(r.entra) used.add(r.entra); if(r.sale) used.add(r.sale); } });
    return used;
  }
  function eligibleEntra(rowIndex, ctx){
    const used = usedInOtherRows(rowIndex);
    const row = cambiosForm.rows[rowIndex];
    return ctx.todos.filter(p=>
      !ctx.titularesNums.has(p.numero) &&
      !ctx.entrados.has(p.numero) && !ctx.salidos.has(p.numero) &&
      !used.has(p.numero) && p.numero !== row.sale
    );
  }
  function eligibleSale(rowIndex, ctx){
    const used = usedInOtherRows(rowIndex);
    const row = cambiosForm.rows[rowIndex];
    return ctx.todos.filter(p=>{
      const onPitch = ctx.titularesNums.has(p.numero) || ctx.entrados.has(p.numero);
      return onPitch && !ctx.salidos.has(p.numero) && !used.has(p.numero) && p.numero !== row.entra;
    });
  }
  function playerLabel(numero){
    const p = state.roster.find(r=>r.numero===numero);
    return p ? p.nombre : `Nº ${numero}`;
  }
  function renderPickerField(rowIndex, field, label){
    const row = cambiosForm.rows[rowIndex];
    const val = row[field];
    const filled = val !== '';
    const content = filled ? `${esc(val)} · ${esc(playerLabel(val))}` : `<span class="ph">Elegir ${label.toLowerCase()}…</span>`;
    const isOpen = openCambioPicker && openCambioPicker.row===rowIndex && openCambioPicker.field===field;
    let html = `<button type="button" class="picker-field${filled?' filled':''}" data-picker-row="${rowIndex}" data-picker-field="${field}">
      <span>${content}</span><span class="chev">${isOpen?'▲':'▼'}</span>
    </button>`;
    if(isOpen){
      const ctx = cambiosEligibility();
      const options = field==='entra' ? eligibleEntra(rowIndex, ctx) : eligibleSale(rowIndex, ctx);
      if(options.length===0){
        html += `<div class="picker-panel"><div class="chip-empty">${field==='entra'?'No hay suplentes disponibles.':'No hay jugadores en el campo disponibles.'}</div></div>`;
      } else {
        html += `<div class="picker-panel"><div class="chip-grid">
          ${options.map(p=>`<button type="button" class="chip${p.numero===val?' selected':''}" data-chip-row="${rowIndex}" data-chip-field="${field}" data-chip-val="${esc(p.numero)}"><span class="cn">${esc(p.numero)}</span>${esc(p.nombre)}</button>`).join('')}
        </div></div>`;
      }
    }
    return html;
  }
  function renderCambiosTab(){
    const vm = computeVentanaMinuto(state.subs);
    const locked = vm[cambiosForm.ventana];
    const ventanaButtons = VENTANAS.map(v=>`
      <button class="ventana-btn" data-vkey="${v.key}" style="background:${v.soft};color:${v.color};border-color:${cambiosForm.ventana===v.key?v.color:'transparent'}">${v.short}</button>
    `).join('');
    const hint = locked!==undefined ? `<p class="hint" style="margin-bottom:8px;">Esta ventana ya está fijada en el minuto ${locked}'</p>` : '';
    const rosterHint = state.roster.length===0 ? `<p class="hint" style="color:var(--danger);">Añade primero la alineación para poder registrar cambios.</p>` : '';
    const minutoValue = locked!==undefined ? locked : cambiosForm.minuto;

    const rowsHtml = cambiosForm.rows.map((row, i)=>`
      <div class="row-block">
        <div class="row-block-head">
          <span>Cambio ${i+1}</span>
          ${i>0?`<button type="button" class="btn-link" data-remove-row="${i}">Quitar</button>`:''}
        </div>
        <div class="field-row" style="margin-bottom:0;">
          <div class="field">${renderPickerField(i, 'entra', 'Entra')}</div>
        </div>
        <div class="field-row" style="margin:7px 0 0;">
          <div class="field">${renderPickerField(i, 'sale', 'Sale')}</div>
        </div>
      </div>
    `).join('');

    const addRowBtn = cambiosForm.rows.length < 3
      ? `<button class="btn-ghost" id="btn-add-row">+ Añadir otro cambio (${cambiosForm.rows.length}/3)</button>`
      : '';

    return `
    <div class="tab-content">
      ${rosterHint}
      <div class="card">
        <div class="ventana-row">${ventanaButtons}</div>
        ${hint}
        <div class="field-row" style="margin-bottom:12px;">
          <div class="field" style="flex:0 0 6rem;"><label>Minuto</label><input type="text" inputmode="numeric" pattern="[0-9]*" id="f-minuto" value="${esc(minutoValue)}" placeholder="—" maxlength="3" onfocus="this.select()" ${locked!==undefined?'disabled':''}></div>
          <div class="field" style="justify-content:flex-end;"><span class="hint" style="margin:0;">Mismo minuto para todos los cambios de esta tanda</span></div>
        </div>
        ${rowsHtml}
        ${addRowBtn}
        <button class="btn-primary" id="btn-add-cambio" disabled style="margin-top:10px;">+ Registrar cambios</button>
      </div>
      <div id="cambios-list">${renderCambiosList()}</div>
    </div>`;
  }
  function renderCambiosList(){
    const groups = VENTANAS.map(v=>({...v, items: state.subs.filter(s=>s.ventana===v.key).sort((a,b)=>Number(a.minuto)-Number(b.minuto))})).filter(g=>g.items.length>0);
    if(groups.length===0) return `<div class="empty">Todavía no has registrado ningún cambio.</div>`;
    return groups.map((g,gi)=>`
      <div class="${gi>0?'group-divider':''}">
        <div class="group-header"><span class="dot" style="background:${g.color}"></span><span class="group-label" style="color:${g.color}">${g.label}</span></div>
        ${g.items.map(s=>`
          <div class="event-row">
            <div class="event-left">
              <span class="minute-badge">${s.minuto}'</span>
              <span class="event-text"><span style="color:var(--ok)">↑${s.entra} ${esc(playerLabel(s.entra))}</span></span>
            </div>
            <button class="del-btn" data-del-sub="${s.id}">🗑</button>
          </div>
          <div class="event-row" style="padding-top:0;margin-top:-4px;">
            <div class="event-left">
              <span class="minute-badge" style="visibility:hidden;">${s.minuto}'</span>
              <span class="event-text" style="font-size:12px;"><span style="color:var(--danger)">↓${s.sale} ${esc(playerLabel(s.sale))}</span></span>
            </div>
          </div>`).join('')}
      </div>
    `).join('');
  }
  function attachCambiosEvents(){
    document.querySelectorAll('.ventana-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        cambiosForm.ventana = btn.dataset.vkey;
        render();
      });
    });
    const fMinuto = document.getElementById('f-minuto');
    const btnAdd = document.getElementById('btn-add-cambio');

    function hasAnyCompleteRow(){
      return cambiosForm.rows.some(r=>r.entra!=='' && r.sale!=='');
    }
    function refreshSubmitState(){
      btnAdd.disabled = !(hasAnyCompleteRow() && fMinuto.value !== '');
    }
    fMinuto.addEventListener('input', ()=>{ cambiosForm.minuto = fMinuto.value; refreshSubmitState(); });
    refreshSubmitState();

    document.querySelectorAll('[data-picker-row]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const row = Number(btn.dataset.pickerRow), field = btn.dataset.pickerField;
        if(openCambioPicker && openCambioPicker.row===row && openCambioPicker.field===field){
          openCambioPicker = null;
        } else {
          openCambioPicker = {row, field};
        }
        render();
      });
    });
    document.querySelectorAll('[data-chip-row]').forEach(chip=>{
      chip.addEventListener('click', ()=>{
        const row = Number(chip.dataset.chipRow), field = chip.dataset.chipField, val = chip.dataset.chipVal;
        cambiosForm.rows[row][field] = val;
        openCambioPicker = null;
        render();
      });
    });
    document.querySelectorAll('[data-remove-row]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        cambiosForm.rows.splice(Number(btn.dataset.removeRow), 1);
        openCambioPicker = null;
        render();
      });
    });
    const addRowBtn = document.getElementById('btn-add-row');
    if(addRowBtn){
      addRowBtn.addEventListener('click', ()=>{
        if(cambiosForm.rows.length < 3) cambiosForm.rows.push({entra:'',sale:''});
        render();
      });
    }

    btnAdd.addEventListener('click', ()=>{
      if(!hasAnyCompleteRow() || fMinuto.value==='') return;
      const minuto = fMinuto.value;
      let added = 0;
      cambiosForm.rows.forEach(row=>{
        if(row.entra!=='' && row.sale!==''){
          state.subs.push({id:uid(), ventana:cambiosForm.ventana, entra:row.entra, sale:row.sale, minuto});
          added++;
        }
      });
      if(added===0) return;
      saveMatch();
      cambiosForm.rows = [{entra:'',sale:''}];
      cambiosForm.minuto = '';
      openCambioPicker = null;
      render();
    });

    document.getElementById('cambios-list').addEventListener('click', (e)=>{
      const btn = e.target.closest('[data-del-sub]');
      if(btn){ state.subs = state.subs.filter(s=>s.id!==btn.dataset.delSub); saveMatch(); render(); }
    });
  }

  function attachTarjetasEvents(){

      btn.addEventListener('click', ()=>{ tarjetasForm.tipo = btn.dataset.tipo; render(); });
    });
    document.querySelectorAll('[data-tarjeta-player]').forEach(chip=>{
      chip.addEventListener('click', ()=>{ tarjetasForm.dorsal = chip.dataset.tarjetaPlayer; render(); });
    });
    const minuto = document.getElementById('t-minuto');
    const btnAdd = document.getElementById('btn-add-tarjeta');
    function validate(){
      tarjetasForm.minuto = minuto.value;
      btnAdd.disabled = !(tarjetasForm.dorsal !== '' && minuto.value!=='');
    }
    minuto.addEventListener('input', validate);
    validate();
    btnAdd.addEventListener('click', ()=>{
      if(tarjetasForm.dorsal==='' || minuto.value==='') return;
      state.cards.push({id:uid(), dorsal:tarjetasForm.dorsal, tipo:tarjetasForm.tipo, minuto:minuto.value});
      saveMatch();
      tarjetasForm.dorsal=''; tarjetasForm.minuto='';
      render();
    });
    document.getElementById('tarjetas-list').addEventListener('click',(e)=>{
      const btn = e.target.closest('[data-del-card]');
      if(btn){ state.cards = state.cards.filter(c=>c.id!==btn.dataset.delCard); saveMatch(); render(); }
    });
  }

  // ---------- Goles (con selector de jugadores) ----------
  function renderGolesTab(){
    const players = convocados();
    const playersHtml = players.length===0
      ? `<div class="chip-empty">Añade primero la alineación.</div>`
      : `<div class="chip-grid">${players.map(p=>`<button type="button" class="chip${golesForm.dorsal===p.numero?' selected':''}" data-gol-player="${esc(p.numero)}"><span class="cn">${esc(p.numero)}</span>${esc(p.nombre)}</button>`).join('')}</div>`;

    return `
    <div class="tab-content">
      <div class="card">
        <span style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;color:var(--muted);display:block;margin-bottom:8px;">⚽ Gol de ${esc(HOME_NAME)}</span>
        ${playersHtml}
        <div class="field-row" style="margin-top:12px;">
          <div class="field" style="flex:0 0 7rem;"><label>Minuto</label><input type="text" inputmode="numeric" pattern="[0-9]*" id="g-minuto" value="${esc(golesForm.minuto)}" placeholder="—" maxlength="3" onfocus="this.select()"></div>
        </div>
        <button class="btn-primary" id="btn-add-gol" disabled>+ Registrar gol</button>
      </div>
      <div id="goles-list">${renderGolesList()}</div>
      <div class="card soft" style="margin-top:16px;">
        <span style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;color:var(--muted);display:block;margin-bottom:8px;">Gol del ${esc(state.awayName)}</span>
        <div class="field-row" style="align-items:flex-end;margin-bottom:0;">
          <div class="field"><label>Minuto</label><input type="text" inputmode="numeric" pattern="[0-9]*" id="gr-minuto" value="" placeholder="—" maxlength="3" onfocus="this.select()"></div>
          <button id="btn-add-rival-gol" class="btn-primary" style="flex:0 0 auto;width:auto;padding:11px 20px;background:var(--rival);box-shadow:none;">+1 gol</button>
        </div>
      </div>
      <div id="rival-goles-list">${renderRivalGolesList()}</div>
    </div>`;
  }
  function renderGolesList(){
    if(state.goals.length===0) return `<div class="empty">Tu equipo aún no ha marcado.</div>`;
    return [...state.goals].sort((a,b)=>Number(a.minuto)-Number(b.minuto)).map(g=>`
      <div class="event-row">
        <div class="event-left"><span class="minute-badge">${g.minuto}'</span><span class="event-text">⚽ ${esc(playerLabel(g.dorsal))}</span></div>
        <button class="del-btn" data-del-goal="${g.id}">🗑</button>
      </div>`).join('');
  }
  function renderRivalGolesList(){
    if(state.rivalGoals.length===0) return '';
    return [...state.rivalGoals].sort((a,b)=>Number(a.minuto)-Number(b.minuto)).map(g=>`
      <div class="event-row">
        <div class="event-left"><span class="minute-badge">${g.minuto}'</span><span class="event-text">Gol ${esc(state.awayName)}</span></div>
        <button class="del-btn" data-del-rivalgoal="${g.id}">🗑</button>
      </div>`).join('');
  }
  function attachGolesEvents(){
    document.querySelectorAll('[data-gol-player]').forEach(chip=>{
      chip.addEventListener('click', ()=>{ golesForm.dorsal = chip.dataset.golPlayer; render(); });
    });
    const minuto = document.getElementById('g-minuto');
    const btnAdd = document.getElementById('btn-add-gol');
    function validate(){
      golesForm.minuto = minuto.value;
      btnAdd.disabled = !(golesForm.dorsal !== '' && minuto.value!=='');
    }
    minuto.addEventListener('input', validate);
    validate();
    btnAdd.addEventListener('click', ()=>{
      if(golesForm.dorsal==='' || minuto.value==='') return;
      state.goals.push({id:uid(), dorsal:golesForm.dorsal, minuto:minuto.value});
      saveMatch();
      golesForm.dorsal=''; golesForm.minuto='';
      render();
    });
    document.getElementById('goles-list').addEventListener('click',(e)=>{
      const btn = e.target.closest('[data-del-goal]');
      if(btn){ state.goals = state.goals.filter(g=>g.id!==btn.dataset.delGoal); saveMatch(); render(); }
    });
    const rMinuto = document.getElementById('gr-minuto');
    const btnRival = document.getElementById('btn-add-rival-gol');
    btnRival.addEventListener('click', ()=>{
      if(rMinuto.value==='') return;
      state.rivalGoals.push({id:uid(), minuto:rMinuto.value});
      saveMatch();
      render();
    });
    const rivalList = document.getElementById('rival-goles-list');
    if(rivalList) rivalList.addEventListener('click',(e)=>{
      const btn = e.target.closest('[data-del-rivalgoal]');
      if(btn){ state.rivalGoals = state.rivalGoals.filter(g=>g.id!==btn.dataset.delRivalgoal); saveMatch(); render(); }
    });
  }

  // ---------- Observaciones ----------
  function renderObservacionesTab(){
    return `
    <div class="tab-content">
      <div class="card">
        <span style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;color:var(--muted);display:block;margin-bottom:8px;">📝 Observaciones del partido</span>
        <textarea id="obs-text" placeholder="Lesiones, incidencias, decisiones arbitrales raras, lo que quieras anotar..." style="min-height:200px; resize:vertical; font-weight:500; text-align:left;">${esc(state.observaciones)}</textarea>
      </div>
    </div>`;
  }
  function attachObservacionesEvents(){
    const txt = document.getElementById('obs-text');
    txt.addEventListener('input', ()=>{ state.observaciones = txt.value; });
    txt.addEventListener('blur', ()=>{ saveMatch(); });
  }

  // ---------- Bottom nav ----------
  function renderBottomNav(){
    const items = [
      {key:'alineacion', label:'Once', icon:'👥', count: state.roster.length},
      {key:'cambios', label:'Cambios', icon:'⇄', count: state.subs.length},
      {key:'tarjetas', label:'Tarjetas', icon:'🟨', count: state.cards.length},
      {key:'goles', label:'Goles', icon:'⚽', count: state.goals.length + state.rivalGoals.length},
      {key:'observaciones', label:'Notas', icon:'📝', count: state.observaciones.trim()!==''?1:0},
    ];
    return `<div class="bottom-nav">${items.map(it=>`
      <button class="nav-btn ${state.tab===it.key?'active':''}" data-tab="${it.key}">
        <span class="nav-icon">${it.icon}</span>
        <span class="nav-label">${it.label}</span>
        ${it.count>0?`<span class="nav-badge">${it.count}</span>`:''}
      </button>
    `).join('')}</div>`;
  }
  function attachBottomNavEvents(){
    document.querySelectorAll('.nav-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{ state.tab = btn.dataset.tab; editingPlayer = null; openCambioPicker = null; render(); });
    });
  }

  // ---------- Resumen ----------
  function renderResumen({awayName, homeScore, awayScore, esLocal, roster, subs, cards, goals, rivalGoals, observaciones, archivedLabel, showArchiveBtn}){
    roster = roster || [];
    const salidas = {}, entradas = {};
    subs.forEach(s=>{ salidas[s.sale] = s; entradas[s.entra] = s; });
    const titulares = roster.slice(0,11);
    const suplentes = roster.slice(11,18);
    const noConvocados = roster.slice(18);
    const groups = VENTANAS.map(v=>({...v, items: subs.filter(s=>s.ventana===v.key).sort((a,b)=>Number(a.minuto)-Number(b.minuto))})).filter(g=>g.items.length>0);
    const sortedCards = [...cards].sort((a,b)=>Number(a.minuto)-Number(b.minuto));
    const sortedGoals = [...goals].sort((a,b)=>Number(a.minuto)-Number(b.minuto));
    const sortedRival = [...rivalGoals].sort((a,b)=>Number(a.minuto)-Number(b.minuto));
    const leftName = esLocal? HOME_NAME : awayName;
    const rightName = esLocal? awayName : HOME_NAME;
    const leftScore = esLocal? homeScore : awayScore;
    const rightScore = esLocal? awayScore : homeScore;
    const nameOf = (numero)=>{ const p = roster.find(r=>r.numero===numero); return p ? p.nombre : `Nº ${numero}`; };

    return `
    <div>
      <div class="resumen-header">
        <button class="back-btn" id="resumen-back">←</button>
        <span class="resumen-title">Resumen del partido</span>
      </div>
      <div class="resumen-body">
        ${archivedLabel? `<p class="archive-label">${esc(archivedLabel)}</p>`:''}
        <div class="score-card">
          <div class="label">Resultado final</div>
          <div class="row">
            <span class="side">${esc(leftName)}</span>
            <span class="score-num amber">${leftScore}</span>
            <span class="score-dash">–</span>
            <span class="score-num chalk">${rightScore}</span>
            <span class="side">${esc(rightName)}</span>
          </div>
          <div class="sublabel">${esc(HOME_NAME)} juega como ${esLocal?'local':'visitante'}</div>
        </div>

        <div class="section">
          <h3>Alineación</h3>
          ${roster.length===0? `<p class="empty-line">Sin alineación registrada.</p>` : `
            <div class="list-box">
              ${titulares.map(p=>renderPlayerLine(p, salidas, roster, true, entradas)).join('')}
              ${suplentes.length>0? `<div style="border-top:1px solid var(--border);margin-top:4px;padding-top:4px;">${suplentes.map(p=>renderPlayerLine(p, salidas, roster, true, entradas)).join('')}</div>` : ''}
              ${noConvocados.length>0? `<div style="border-top:1px solid var(--border);margin-top:4px;padding-top:4px;opacity:.6;">${noConvocados.map(p=>renderPlayerLine(p, salidas, roster, true, entradas)).join('')}</div>` : ''}
            </div>
          `}
        </div>

        <div class="section">
          <h3>Cambios</h3>
          ${groups.length===0? `<p class="empty-line">Sin cambios registrados.</p>` : `
            <div class="group-box">
              ${groups.map((g,gi)=>`
                <div style="${gi>0?'border-top:1px solid var(--border)':''}">
                  <div class="g-head" style="background:${g.soft}"><span style="color:${g.color}">${g.label}</span></div>
                  <div class="g-body">
                    ${g.items.map(s=>`<div><span style="font-family:monospace;opacity:.6;margin-right:6px;">${s.minuto}'</span><span style="color:var(--ok)">↑${s.entra} ${esc(nameOf(s.entra))}</span> <span style="color:var(--danger)">↓${s.sale} ${esc(nameOf(s.sale))}</span></div>`).join('')}
                  </div>
                </div>
              `).join('')}
            </div>
          `}
        </div>

        <div class="section">
          <h3>Tarjetas</h3>
          ${sortedCards.length===0? `<p class="empty-line">Sin tarjetas registradas.</p>` : `
            <div class="list-box">
              ${sortedCards.map(c=>`<div><span style="font-family:monospace;opacity:.6;margin-right:6px;">${c.minuto}'</span>${cardChip(c.tipo)} ${esc(nameOf(c.dorsal))} <span style="font-weight:400;opacity:.5">· ${tipoLabel(c.tipo)}</span></div>`).join('')}
            </div>
          `}
        </div>

        <div class="section">
          <h3>Goles ${esc(HOME_NAME)}</h3>
          ${sortedGoals.length===0? `<p class="empty-line">Sin goles registrados.</p>` : `
            <div class="list-box">
              ${sortedGoals.map(g=>`<div><span style="font-family:monospace;opacity:.6;margin-right:6px;">${g.minuto}'</span>⚽ ${esc(nameOf(g.dorsal))}</div>`).join('')}
            </div>
          `}
        </div>

        <div class="section">
          <h3>Goles ${esc(awayName)}</h3>
          ${sortedRival.length===0? `<p class="empty-line">Sin goles registrados.</p>` : `
            <div class="list-box">
              ${sortedRival.map(g=>`<div><span style="font-family:monospace;opacity:.6;margin-right:6px;">${g.minuto}'</span>Gol ${esc(awayName)}</div>`).join('')}
            </div>
          `}
        </div>

        <div class="section">
          <h3>Observaciones</h3>
          ${(!observaciones || observaciones.trim()==='')? `<p class="empty-line">Sin observaciones.</p>` : `
            <div class="list-box"><div style="white-space:pre-wrap;">${esc(observaciones)}</div></div>
          `}
        </div>

        ${showArchiveBtn? `<button class="archive-btn" id="btn-archive-match">🗂 Archivar partido</button>`:''}
      </div>
    </div>`;
  }
  function attachResumenEvents(isLive){
    document.getElementById('resumen-back').addEventListener('click', ()=>{
      state.view = isLive ? 'match' : 'archivo';
      render();
    });
    const archiveBtn = document.getElementById('btn-archive-match');
    if(archiveBtn){
      archiveBtn.addEventListener('click', ()=>{
        const nowIso = new Date().toISOString();
        state.archivedMatches.push({
          id: uid(), date: nowIso, dateLabel: formatDateLabel(nowIso),
          awayName: state.awayName, esLocal: state.esLocal, roster: state.roster, observaciones: state.observaciones,
          homeScore: state.goals.length, awayScore: state.rivalGoals.length,
          subs: state.subs, cards: state.cards, goals: state.goals, rivalGoals: state.rivalGoals,
        });
        saveArchive();
        const rosterIds = new Set(state.roster.map(p=>p.id));
        const reordered = state.roster.map(p=>({ id:p.id, numero:p.numero, nombre:p.nombre }));
        const missing = state.plantilla.filter(pl=>!rosterIds.has(pl.id));
        state.plantilla = [...reordered, ...missing];
        savePlantilla();
        state.awayName = 'Rival'; state.esLocal = true; state.roster = []; state.observaciones = '';
        state.subs = []; state.cards = []; state.goals = []; state.rivalGoals = [];
        seedRosterFromPlantilla();
        saveMatch();
        state.tab = 'alineacion';
        state.view = 'match';
        render();
      });
    }
  }

  // ---------- Archivo ----------
  function renderArchivoView(){
    return `
    <div>
      <div class="resumen-header">
        <button class="back-btn" id="archivo-back">←</button>
        <span class="resumen-title">Partidos guardados</span>
      </div>
      <div class="resumen-body">
        ${state.archivedMatches.length===0? `<div class="empty">Todavía no has archivado ningún partido.</div>` : `
          ${[...state.archivedMatches].sort((a,b)=>new Date(b.date)-new Date(a.date)).map(m=>{
            const eL = m.esLocal ?? true;
            const line = eL
              ? `${esc(HOME_NAME)} ${m.homeScore} – ${m.awayScore} ${esc(m.awayName)}`
              : `${esc(m.awayName)} ${m.awayScore} – ${m.homeScore} ${esc(HOME_NAME)}`;
            return `
            <button class="archivo-item" data-open="${m.id}">
              <div>
                <div class="main">${line}</div>
                <div class="sub">${esc(m.dateLabel)}</div>
              </div>
              <span style="opacity:.4;">›</span>
            </button>`;
          }).join('')}
        `}
      </div>
    </div>`;
  }
  function attachArchivoEvents(){
    document.getElementById('archivo-back').addEventListener('click', ()=>{ state.view='match'; render(); });
    document.querySelectorAll('[data-open]').forEach(btn=>{
      btn.addEventListener('click', ()=>{ state.openArchiveId = btn.dataset.open; state.view='archivo-detalle'; render(); });
    });
  }

  loadState();
  render();
})();
</script>
</body>
</html>
